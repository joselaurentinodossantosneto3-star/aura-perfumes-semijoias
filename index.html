<style>/* Layout: loja da Aura · Perfumes e Semijoias (preto, bege #B1A090 e branco; Poppins; logo oficial;
   halo de luz bege atrás de cada peça, molduras de cantos suaves, pílulas) + painel da loja no mesmo arquivo.
   Identidade deliberadamente clara (fundo branco com áreas em rosa bem claro, como uma vitrine de joias):
   um único tema, com todas as cores definidas aqui. Os nomes --gold* são históricos: hoje guardam o rosé. */
:root{
  /* cor: neutros com um toque de rosa */
  --bg:#FFFFFF;--surface:#FFFFFF;--soft:#F8F5F2;--soft-2:#EFE9E3;--line:#E9E2DB;--line-2:#D8CDC2;
  --ink:#000000;--ink-2:#3B3632;--muted:#75695E;
  /* acento rosé: --gold = rosa claro (filetes, molduras, preenchimentos), --gold-ink = rosé escuro (texto e links),
     --gold-hi = rosa bem claro sobre fundo escuro, --gold-soft = fundo rosado de destaque */
  --gold:#B1A090;--gold-ink:#7A6A5B;--gold-hi:#D9CEC2;--gold-soft:#F4EFEA;
  --btn:#000000;--on-btn:#FFFFFF;--bar:#FFFFFF;--on-bar:#7A6A5B;--on-bar-2:#75695E;
  /* luz da aura: três tons claros do bege da marca, no halo atrás das peças */
  --aura-1:#EDE5DC;--aura-2:#F5EFE9;--aura-3:#E3D9CE;
  --halo:radial-gradient(58% 54% at 50% 50%,rgba(255,255,255,.97) 0 36%,rgba(255,255,255,0) 74%),radial-gradient(72% 64% at 24% 26%,var(--aura-1) 0,rgba(237,229,220,0) 72%),radial-gradient(66% 62% at 82% 30%,var(--aura-3) 0,rgba(227,217,206,0) 72%),radial-gradient(84% 64% at 58% 96%,var(--aura-2) 0,rgba(245,239,233,0) 74%),#FDFCFB;
  --r-frame:26px;--r-card:22px;--r-campo:14px;
  /* cores das peças desenhadas (metal e pedras) */
  --silver:#A2A7B0;--pearl:#FFFDF7;--crystal:#F8E9E7;--shine:#FFFFFF;--rg:#B98272;--rg-stone:#EBCFC5;
  --sale:#A12F45;--on-sale:#FFFFFF;--sale-soft:#FBE7EB;
  --ok:#3F7A52;--ok-soft:#E7F2EA;--warn:#A5612C;--warn-soft:#FBEEDF;--info:#3E5F7F;--info-soft:#E6EEF6;
  --whats:#1F9D55;
  --scrim:rgba(0,0,0,.42);--shadow:0 30px 70px rgba(70,52,36,.14);--shadow-sm:0 16px 38px rgba(70,52,36,.12);--shadow-xs:0 2px 8px rgba(70,52,36,.08);
  --ease:cubic-bezier(.2,.75,.1,1);--ease-io:cubic-bezier(.7,0,.2,1);
  /* tipo */
  --display:"Poppins","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Poppins","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));--gutter-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
img{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* toasts (loja e painel) */
.toasts{position:fixed;z-index:200;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-btn);padding:12px 16px;font-size:14px;box-shadow:var(--shadow);width:100%;animation:toastIn .35s var(--ease)}
.toast .t-ic{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--gold);color:var(--ink)}
.toast.erro .t-ic{background:var(--sale);color:var(--on-sale)}
.toast .t-msg{flex:1;min-width:0}
.toast .t-acao{background:none;border:0;color:var(--gold-hi);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.toast.sai{animation:toastOut .3s var(--ease-io) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ===================== LOJA (storefront) =====================
   Vitrine de perfumes e semijoias: branco, preto e bege, tudo em Poppins.
   Peças sempre sobre um halo de luz, em moldura de cantos suaves. Todas as classes começam com .l- (o painel usa .p-). */
.modo-loja{min-height:100vh;background:var(--bg);color:var(--ink);overflow-x:clip}
.modo-loja .num{font-variant-numeric:tabular-nums}
.l-main{outline:none;display:block}
#l-cabeca{display:contents}
.l-wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);min-width:0}
.l-eyebrow{font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink);margin:0}
.muted{color:var(--muted)}
.l-pular:focus{position:fixed;z-index:120;left:16px;top:16px;width:auto;height:auto;clip:auto;padding:10px 16px;background:var(--ink);color:var(--on-btn);border:0}
.l-h2{font-family:var(--display);font-size:clamp(30px,3.6vw,46px);line-height:1.08;letter-spacing:-.01em;margin-top:10px}
.l-h3{font-family:var(--display);font-size:26px;line-height:1.15}
.modo-loja em{font-style:italic;color:var(--gold-ink)}
.l-spark{width:10px;height:10px;color:var(--gold)}

/* botões ----------------------------------------------------------------- */
.l-btn,.l-btn-ghost,.l-btn-wa{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:14px 26px;font:500 14px/1.15 var(--body);letter-spacing:0;text-transform:none;cursor:pointer;text-decoration:none;border-radius:0;transition:color .45s var(--ease-io),border-color .45s,background-color .3s;text-align:center}
.l-btn svg,.l-btn-ghost svg,.l-btn-wa svg{width:17px;height:17px;flex-shrink:0}
.l-btn{background:var(--btn);color:var(--on-btn);border:1px solid var(--btn)}
.l-btn::before,.l-btn-ghost::before{content:"";position:absolute;inset:0;z-index:-1;transform:scaleX(0);transform-origin:right;transition:transform .55s var(--ease-io)}
.l-btn::before{background:var(--ink)}
.l-btn:hover{border-color:var(--ink)}
.l-btn:hover::before,.l-btn-ghost:hover::before{transform:scaleX(1);transform-origin:left}
.l-btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.l-btn-ghost::before{background:var(--ink)}
.l-btn-ghost:hover{color:var(--on-btn)}
.l-btn-wa{background:var(--whats);color:var(--on-btn);border:1px solid var(--whats)}
.l-btn-wa:hover{background:color-mix(in srgb,var(--whats) 86%,var(--ink))}
.l-btn[disabled],.l-btn-ghost[disabled]{opacity:.42;cursor:not-allowed}
.l-btn[disabled]::before{display:none}
.l-btn.full,.l-btn-ghost.full,.l-btn-wa.full{width:100%}
.l-btn.grande,.l-btn-wa.grande{min-height:54px;padding:16px 28px;font-size:14.5px}
.l-btn.ouro{background:var(--gold-ink);border-color:var(--gold-ink)}
.l-btn.ouro::before{background:var(--ink)}
.l-btn.verde{background:var(--whats);border-color:var(--whats)}
.l-btn.verde::before{background:color-mix(in srgb,var(--whats) 80%,var(--ink))}
.l-btn.carregando span::after{content:"";display:inline-block;width:12px;height:12px;margin-left:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;animation:lGira .8s linear infinite}
.l-btn-ghost.peq,.l-btn.peq{min-height:40px;padding:9px 14px;font-size:13px}
.l-link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--gold-ink);font:500 13.5px/1.3 var(--body);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--gold) 50%,transparent);text-underline-offset:4px;transition:color .3s,gap .35s var(--ease)}
.l-link svg{width:15px;height:15px}
.l-link:hover{color:var(--ink);gap:9px}
.l-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.l-cta.center{justify-content:center}
.l-x{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:50%;cursor:pointer;color:var(--ink);transition:border-color .3s,transform .4s var(--ease)}
.l-x svg{width:17px;height:17px}
.l-x:hover{border-color:var(--gold);transform:rotate(90deg)}
.l-x.peq{width:30px;height:30px}
.l-x.peq svg{width:14px;height:14px}

/* faixa de atendimento ---------------------------------------------------- */
.l-status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:.04em}
.l-status i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.l-status.aberto{color:var(--ok)}
.l-status.aberto i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:lPulso 2.4s ease-in-out infinite}
.l-status.fechado{color:var(--warn)}
.l-status.fechado i{background:var(--warn)}

/* aviso fino: uma condição por vez ---------------------------------------- */
.l-aviso{background:var(--soft);border-bottom:1px solid var(--line);color:var(--gold-ink);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none}
.l-aviso-in{display:grid;place-items:center;min-height:32px;text-align:center}
.l-aviso-msg{grid-area:1/1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(5px);transition:opacity .6s,transform .6s var(--ease);pointer-events:none}
.l-aviso-msg.on{opacity:1;transform:none;pointer-events:auto}

/* topo: menu | marca | ícones ------------------------------------------------ */
.l-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);transition:box-shadow .4s}
.l-top.rolou{box-shadow:0 10px 30px color-mix(in srgb,var(--gold-ink) 8%,transparent)}
.l-top-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"nav brand actions";align-items:center;gap:20px;padding-block:20px;transition:padding .45s var(--ease)}
.l-top.rolou .l-top-in{padding-block:11px}
.l-catnav{grid-area:nav;min-width:0}
.l-catnav-in{display:flex;align-items:center;gap:20px;overflow-x:auto;scrollbar-width:none}
.l-catnav-in::-webkit-scrollbar{display:none}
.l-catnav-in>button{position:relative;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:10px 0;cursor:pointer;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);transition:color .3s}
.l-catnav-in>button::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .45s var(--ease-io)}
.l-catnav-in>button:hover,.l-catnav-in>button[aria-expanded="true"]{color:var(--gold-ink)}
.l-catnav-in>button:hover::after,.l-catnav-in>button[aria-expanded="true"]::after{transform:scaleX(1);transform-origin:left}
.l-catnav-in svg{width:12px;height:12px;transition:transform .3s var(--ease)}
.l-catnav-in [aria-expanded="true"] svg{transform:rotate(180deg)}
.l-catnav .l-sale{color:var(--sale)}
.l-brand{grid-area:brand;display:flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1;text-align:center;min-width:0}
.l-brand-name{font-family:var(--display);font-size:23px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;white-space:nowrap;transition:font-size .45s var(--ease)}
.l-brand-sub{display:flex;align-items:center;gap:10px;font-size:9.5px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-ink);margin-top:7px;padding-left:.42em;transition:margin .45s var(--ease)}
.l-brand-sub::before,.l-brand-sub::after{content:"";width:22px;height:1px;background:var(--gold)}
.l-top.rolou .l-brand-name{font-size:20px}
.l-top.rolou .l-brand-sub{margin-top:5px}
.l-actions{grid-area:actions;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.l-ic{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:8px;background:none;border:0;cursor:pointer;text-decoration:none;color:var(--ink);transition:color .3s}
.l-ic:hover,.l-ic[aria-current="page"],.l-ic[aria-expanded="true"]{color:var(--gold-ink)}
.l-ic svg{width:21px;height:21px}
.l-ic .lbl{display:none}
.l-badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;line-height:1}
.l-badge[data-n="0"]{display:none}
.l-badge.bump{animation:lPop .5s var(--ease)}
.l-dot-logada{display:none;position:absolute;top:10px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.l-ic-conta.logada .l-dot-logada{display:block}
/* busca: abre pela lupa, numa linha embaixo do topo */
.l-hsearch{display:none;border-top:1px solid var(--line);padding-block:14px}
.l-top.busca-aberta .l-hsearch{display:block;animation:lDrop .3s var(--ease) both}
.l-hsearch-in{position:relative;z-index:4;max-width:640px;margin:0 auto}
.l-hs-box{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);padding:11px 14px;color:var(--muted);transition:border-color .3s}
.l-hs-box svg{width:17px;height:17px;flex-shrink:0}
.l-hs-box input{border:0;background:transparent;color:var(--ink);font-size:15px;width:100%;outline:none;min-width:0;padding:0}
.l-hs-box input::-webkit-search-cancel-button{opacity:.5}
.l-hs-box:focus-within{border-color:var(--gold);color:var(--gold-ink)}
.l-suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;z-index:40;display:flex;flex-direction:column;gap:10px;animation:lDrop .35s var(--ease) both}
.l-sg-lista{list-style:none;margin:0 -8px;padding:0}
.l-sg-item{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;padding:7px 8px;text-decoration:none;transition:background .2s}
.l-sg-item:hover,.l-sg-item:focus-visible{background:var(--soft)}
.l-sg-item strong{display:block;font-family:var(--display);font-weight:400;font-size:15.5px;line-height:1.2}
.l-sg-item small{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.l-sg-todos{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:13px;font-weight:500;text-align:left}
.l-sg-todos svg{width:15px;height:15px;color:var(--gold-ink);flex-shrink:0}
.l-sg-todos:hover{border-color:var(--gold)}
.l-sg-vazio{font-size:13.5px;color:var(--muted)}
/* menus Produtos e Ocasiões (abrem embaixo do topo) */
.l-mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 26px 40px -18px color-mix(in srgb,var(--gold-ink) 22%,transparent);max-height:calc(100vh - 160px);overflow-y:auto;z-index:2}
.l-mega-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding-block:20px 22px}
.l-mega-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;cursor:pointer;text-align:left;min-width:0;transition:border-color .3s,transform .4s var(--ease)}
.l-mega-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.l-mega-item .l-cat-circle{width:52px;flex-shrink:0}
.l-mega-item>span:last-of-type,.l-mega-item>span:nth-child(2){min-width:0}
.l-mega-item strong{display:block;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none}
.l-mega-item small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.l-mega-item.tudo{justify-content:space-between;background:var(--soft)}
.l-mega-item.tudo svg{width:16px;height:16px;color:var(--gold-ink);flex-shrink:0}
.l-mega-ini{width:52px;height:52px;flex-shrink:0;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:italic 400 24px/1 var(--display);color:var(--gold-ink);background:var(--gold-soft)}
.l-mega:not([hidden]) .l-mega-item{animation:lFadeUp .5s var(--ease) both;animation-delay:calc(var(--d,0)*40ms)}
/* telas médias: marca à esquerda, menu numa linha embaixo */
@media (max-width:1180px){
  .l-top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "nav nav";gap:0 12px;padding-block:12px 0}
  .l-top.rolou .l-top-in{padding-block:8px 0}
  .l-brand{align-items:flex-start;text-align:left}
  .l-brand-name{padding-left:0}
  .l-brand-sub{padding-left:0}
  .l-brand-sub::before{display:none}
  .l-catnav{margin:10px calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l));padding:0 var(--gutter-r) 0 var(--gutter-l);border-top:1px solid var(--line)}
  .l-catnav-in>button{padding:12px 0}
  .l-catnav-in>button::after{bottom:7px}
}
/* se o menu não couber ao lado da marca (tela estreita ou fonte maior), o JS liga .apertado */
.l-top.apertado .l-top-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand actions" "nav nav";gap:0 12px;padding-block:12px 0}
.l-top.apertado.rolou .l-top-in{padding-block:8px 0}
.l-top.apertado .l-brand{align-items:flex-start;text-align:left}
.l-top.apertado .l-brand-name{padding-left:0}
.l-top.apertado .l-brand-sub{padding-left:0}
.l-top.apertado .l-brand-sub::before{display:none}
.l-top.apertado .l-catnav{margin:10px calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l));padding:0 var(--gutter-r) 0 var(--gutter-l);border-top:1px solid var(--line)}
.l-top.apertado .l-catnav-in>button{padding:12px 0}
.l-top.apertado .l-catnav-in>button::after{bottom:7px}
@media (max-width:860px){
  .l-brand-name{font-size:19px;letter-spacing:.14em}
  .l-top.rolou .l-brand-name{font-size:17px}
  .l-brand-sub{letter-spacing:.34em;font-size:9px;margin-top:6px}
  .l-actions{gap:0}
  .l-ic{min-width:40px;padding:8px 6px}
  .l-ic-fav{display:none}
  .l-catnav-in{gap:22px}
  .l-hsearch{padding-block:10px 12px}
  .l-mega-in{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-block:14px 16px}
  .l-mega-in.oc{grid-template-columns:1fr}
  .l-mega-item{padding:8px}
  .l-mega-item .l-cat-circle,.l-mega-ini{width:42px;height:42px}
  .l-mega-item strong{font-size:13px;letter-spacing:0}
}
@media (max-width:420px){.l-brand-name{font-size:17px;letter-spacing:.11em}.l-catnav-in{gap:12px;justify-content:space-between}.l-catnav-in>button{font-size:12px;letter-spacing:0}}

.l-foot-demo{color:var(--muted)}

/* moldura em arco ------------------------------------------------------- */
.l-frame{position:relative;display:block;aspect-ratio:4/5;max-width:100%;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--line);background:var(--soft);isolation:isolate}
.l-frame .art{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s var(--ease)}
.l-frame img,.l-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),opacity .6s}
.l-frame img.l-alt{opacity:0}
.l-frame.mini{border-radius:0;aspect-ratio:1}
.l-frame.mini .art{inset:-8% -4% -2%;width:108%;height:110%}
.l-frame::after{content:"";position:absolute;inset:-10% -60%;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--shine) 72%,transparent) 50%,transparent 60%);transform:translateX(-100%);pointer-events:none;z-index:1}
.tone-0{background:radial-gradient(120% 90% at 50% 28%,var(--surface) 0%,var(--soft-2) 82%)}
.tone-1{background:linear-gradient(170deg,var(--soft-2),var(--surface) 75%)}
.tone-2{background:radial-gradient(100% 80% at 30% 18%,var(--surface),var(--crystal) 85%)}
.modo-loja .spk{transform-box:fill-box;transform-origin:center;animation:lTwinkle 3.6s ease-in-out infinite}
.l-card:nth-child(2n) .spk{animation-delay:-1.2s}.l-card:nth-child(3n) .spk{animation-delay:-2.4s}
.l-tags{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;z-index:2}
.l-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;padding:4px 8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);line-height:1.2}
.l-tag-ic svg{width:9px;height:9px}
.l-tag.new{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.l-tag.sale{background:var(--sale);color:var(--on-sale);border-color:var(--sale)}
.l-tag.best{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-hi)}
.l-tag.low{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.l-tag.out{color:var(--muted)}

/* seções ------------------------------------------------------------------ */
.l-sec>.l-wrap{padding-block:80px}
.l-sec-soft{background:var(--soft);border-block:1px solid var(--line)}
.l-sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:32px}
.l-sec-head.center{flex-direction:column;align-items:center;text-align:center}
.l-sec-head.center>div{display:flex;flex-direction:column;align-items:center}
.l-rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin-top:14px}
.l-rule::before,.l-rule::after{content:"";width:40px;height:1px;background:currentColor;transform:scaleX(0);transition:transform 1s .25s var(--ease)}
.l-rule::before{transform-origin:right}.l-rule::after{transform-origin:left}
.l-sec-head.in .l-rule::before,.l-sec-head.in .l-rule::after{transform:scaleX(1)}
.l-rule .l-spark{transition:transform 1.2s .3s var(--ease)}
.l-sec-head:not(.in) .l-rule .l-spark{transform:rotate(-180deg) scale(.4)}
@media (max-width:700px){.l-sec>.l-wrap{padding-block:56px}.l-sec-head{margin-bottom:24px}}

/* hero -------------------------------------------------------------------- */
.l-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--bg),var(--soft) 120%)}
.l-hero-glow{position:absolute;inset:auto -10% -45% 38%;height:125%;background:radial-gradient(closest-side,color-mix(in srgb,var(--gold-hi) 30%,transparent),transparent);pointer-events:none;transform:translate3d(calc(var(--mx,0)*24px),calc(var(--my,0)*18px),0);transition:transform 1.5s var(--ease);animation:lRespira 10s ease-in-out infinite}
.l-hero-in{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding-block:64px 76px}
.l-hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0;max-width:560px}
.l-hero-eb{display:flex;align-items:center;gap:12px}
.l-hero-eb::before{content:"";width:34px;height:1px;background:var(--gold);transform-origin:left;animation:lGrowX 1s .15s var(--ease) both}
.l-hero-tit{font-family:var(--display);font-size:clamp(40px,5.4vw,70px);line-height:1.04;letter-spacing:-.012em}
.l-hero-tit .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em}
.l-hero-tit .w>span{display:inline-block;animation:lRise 1.05s var(--ease) both;animation-delay:calc(var(--i)*65ms + .2s)}
.l-hero-eb{animation:lFade .8s .05s both}
.l-lede{font-size:17px;color:var(--muted);max-width:46ch;animation:lFadeUp .9s .65s var(--ease) both}
.l-hero .l-cta{margin-top:4px;animation:lFadeUp .7s .3s var(--ease) both}
.l-hero-art{display:grid;grid-template-columns:1fr 1.32fr 1fr;align-items:end;gap:16px;min-width:0;transform:translate3d(calc(var(--mx,0)*-14px),calc(var(--my,0)*-10px),0);transition:transform 1.2s var(--ease)}
.l-arch{margin:0;display:flex;flex-direction:column;gap:10px;text-align:center;min-width:0;animation:lArchIn 1.3s var(--ease) both}
.l-arch-1{margin-bottom:28px;animation-delay:.35s}.l-arch-2{animation-delay:.18s}.l-arch-3{margin-bottom:56px;animation-delay:.5s}
.l-arch figcaption{font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:lFade 1s 1.2s both}
.l-arch .l-frame{animation:lFloat 8s ease-in-out infinite}
.l-arch-1 .l-frame{animation-delay:-2.5s}.l-arch-3 .l-frame{animation-delay:-5s}
.l-arch-2 .l-frame{box-shadow:var(--shadow);outline:1px solid var(--gold);outline-offset:6px}
.l-arch-2 .l-frame::after{animation:lGlint 1.6s 1.5s var(--ease) both}
@media (max-width:860px){
  .l-hero-in{grid-template-columns:1fr;gap:40px;padding-block:36px 52px}
  .l-hero-art{max-width:460px;width:100%;margin:0 auto;gap:12px}
}

/* cartões ----------------------------------------------------------------- */
.l-card{display:flex;flex-direction:column;gap:12px;min-width:0}
.l-card-media{position:relative;transition:transform .6s var(--ease)}
.l-media{display:block;text-decoration:none}
.l-media .l-frame{transition:border-color .4s,box-shadow .6s var(--ease)}
.l-card:hover .l-card-media{transform:translateY(-5px)}
.l-card:hover .l-media .l-frame{border-color:var(--gold);box-shadow:var(--shadow-sm)}
.l-card:hover .l-media .l-frame::after{animation:lGlint 1.1s var(--ease) both}
.l-media:hover .l-frame .art,.l-media:hover .l-frame img{transform:scale(1.06)}
.l-media:hover .l-frame img.l-alt{opacity:1}
.l-card.esgotado .l-frame .art,.l-card.esgotado .l-frame img{filter:grayscale(.55);opacity:.75}
.l-fav{position:absolute;bottom:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);z-index:3;transition:transform .35s var(--ease),color .3s,border-color .3s}
.l-fav svg{width:17px;height:17px}
.l-fav:hover{transform:scale(1.1);border-color:var(--gold)}
.l-fav.on{color:var(--sale)}
.l-fav.on svg path{fill:currentColor}
.l-fav.on svg{animation:lPop .45s var(--ease)}
.l-card-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.l-cat{font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin:0}
.l-name{margin:0}
.l-name a{font-family:var(--display);font-size:19px;line-height:1.2;text-decoration:none;transition:color .3s}
.l-name a:hover{color:var(--gold-ink)}
.l-price{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.35}
.l-pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 9px}
.l-price s{font-size:13px;color:var(--muted)}
.l-price strong{font-size:17px;font-weight:600}
.l-pix{font-size:13.5px;color:var(--ink-2)}
.l-pix b{color:var(--gold-ink);font-weight:600}
.l-pix small{color:var(--muted);font-size:12.5px}
.l-inst{font-size:12.5px;color:var(--muted)}
.l-off{font-size:11px;font-weight:600;letter-spacing:.08em;padding:3px 7px;background:var(--sale-soft);color:var(--sale)}
.l-price.grande strong{font-size:28px;font-weight:500;letter-spacing:-.01em}
.l-price.grande s{font-size:16px}
.l-price.grande .l-pix{font-size:15px}
.l-price.grande .l-inst{font-size:13.5px}
.l-dots{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;color:var(--muted);letter-spacing:.03em}
.l-dots i{width:13px;height:13px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 2px var(--surface);border:1px solid var(--line-2)}
.l-dots-txt{margin-left:4px}
.l-buy{display:flex;align-items:center;justify-content:center;margin-top:2px;width:100%;min-height:44px;padding:11px 12px;border:1px solid var(--ink);background:linear-gradient(var(--btn),var(--btn)) left/0% 100% no-repeat transparent;color:var(--ink);font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;cursor:pointer;text-decoration:none;transition:background-size .5s var(--ease-io),color .4s}
.l-buy:hover,.l-buy.ok{background-size:100% 100%;color:var(--on-btn)}
.l-buy.ok{background-image:linear-gradient(var(--gold-ink),var(--gold-ink));border-color:var(--gold-ink)}
.l-buy[disabled]{border-color:var(--line);color:var(--muted);background:transparent;cursor:not-allowed}
@media (max-width:700px){.l-name a{font-size:16.5px}.l-inst{font-size:11.5px}.l-pix{font-size:12.5px}.l-price strong{font-size:16px}.l-fav{width:34px;height:34px;bottom:8px;right:8px}.l-tags{left:8px;bottom:8px}.l-tag{font-size:10.5px;padding:3px 6px;letter-spacing:0}.l-dots-txt{display:none}.l-buy{font-size:12px;letter-spacing:0;padding-inline:6px}}

/* vitrines ----------------------------------------------------------------- */
.l-rail-ctl{display:flex;align-items:center;gap:18px}
.l-rail-nav{display:flex;gap:8px}
.l-rail-nav button{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:border-color .3s}
.l-rail-nav button:hover{border-color:var(--gold)}
.l-rail-nav svg{width:16px;height:16px}
.l-rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 66px)/4);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 12px;margin:-8px -2px 0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;overscroll-behavior-x:contain}
.l-rail>.l-card{scroll-snap-align:start}
@media (max-width:1000px){.l-rail{grid-auto-columns:calc((100% - 44px)/3)}}
@media (max-width:700px){.l-rail{grid-auto-columns:62%;gap:14px}.l-rail-nav{display:none}}

/* categorias ---------------------------------------------------------------- */
.l-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:24px 16px}
.l-cat-tile{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;min-width:0}
.l-cat-circle{display:block;width:min(150px,100%);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,var(--surface),var(--soft-2) 80%);position:relative;overflow:hidden;transition:border-color .4s,box-shadow .6s var(--ease)}
.l-cat-circle .art{position:absolute;inset:-6% 0 0 0;width:100%;height:110%;transition:transform 1s var(--ease)}
.l-cat-circle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.l-cat-tile:hover .l-cat-circle{border-color:var(--gold);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--gold)}
.l-cat-tile:hover .l-cat-circle .art{transform:scale(1.08) rotate(-3deg)}
.l-cat-name{font-size:14.5px;font-weight:600;letter-spacing:0;text-transform:none;text-align:center}
.l-cat-count{font-size:12.5px;color:var(--muted);margin-top:-8px}
@media (max-width:700px){.l-cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:100px;overflow-x:auto;gap:14px;padding:4px 2px 8px;margin-inline:-2px;scrollbar-width:none}.l-cats::-webkit-scrollbar{display:none}.l-cat-name{font-size:12px;letter-spacing:0}.l-cat-count{font-size:11.5px}}

/* ocasiões ------------------------------------------------------------------- */
.l-ocs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.l-oc{display:flex;flex-direction:column;gap:16px;text-decoration:none;min-width:0}
.l-oc-arch{position:relative;display:block;aspect-ratio:3/4;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--line);background:radial-gradient(110% 80% at 50% 25%,var(--surface),var(--gold-soft) 90%);transition:border-color .4s,box-shadow .6s var(--ease)}
.l-oc-arch .art{position:absolute;left:8%;right:8%;bottom:0;width:84%;height:80%;transition:transform 1.2s var(--ease)}
.l-oc-arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.l-oc-ini{position:absolute;left:0;right:0;top:7%;text-align:center;font:italic 400 clamp(54px,6vw,84px)/1 var(--display);color:color-mix(in srgb,var(--gold-hi) 55%,transparent);pointer-events:none}
.l-oc-ini::after{content:"";display:block;width:28px;height:1px;margin:10px auto 0;background:var(--gold-hi)}
.l-oc:hover .l-oc-arch{border-color:var(--gold);box-shadow:var(--shadow-sm)}
.l-oc:hover .l-oc-arch .art{transform:scale(1.06) translateY(-4px)}
.l-oc-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.l-oc-txt em{font-family:var(--display);font-size:15px;color:var(--muted)}
.l-oc-txt strong{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.l-oc-cta{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink);transition:gap .35s var(--ease)}
.l-oc-cta svg{width:14px;height:14px}
.l-oc:hover .l-oc-cta{gap:10px}
@media (max-width:1000px){.l-ocs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.l-ocs{gap:22px 12px}.l-oc-txt strong{font-size:19px}.l-oc-txt em{font-size:13.5px}}

/* como comprar ---------------------------------------------------------------- */
.l-steps{list-style:none;margin:0 0 32px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);position:relative}
.l-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 26px;min-width:0}
.l-step+.l-step{border-left:1px solid var(--line)}
.l-step-n{width:54px;height:54px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink);font-family:var(--display);font-size:22px;background:var(--bg);transition:background .5s,color .5s,transform .8s var(--ease)}
.l-step:hover .l-step-n{background:var(--btn);color:var(--on-btn);transform:rotate(360deg)}
.l-step h3{font-size:14.5px;font-weight:600;letter-spacing:0;text-transform:none}
.l-step p{font-size:14.5px;color:var(--muted);max-width:32ch}
@media (max-width:760px){.l-steps{grid-template-columns:1fr}.l-step+.l-step{border-left:0;border-top:1px solid var(--line)}.l-step{padding:28px 20px}}

/* institucional -------------------------------------------------------------- */
.l-inst-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.l-inst-big{background:var(--soft);border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:-10px;color:var(--muted);padding:52px 44px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;overflow:hidden;min-width:0}
.l-inst-big::after{content:"";position:absolute;right:-110px;bottom:-150px;width:260px;height:340px;border:1px solid var(--gold);border-radius:200px 200px 0 0;opacity:.35;pointer-events:none}
.l-inst-big h2{font-family:var(--display);font-size:clamp(28px,3.4vw,42px);line-height:1.1;color:var(--ink)}
.l-inst-big p{max-width:46ch}
.l-inst-big .l-cta{position:relative;z-index:1;margin-top:6px}
.l-inst-side{display:grid;gap:18px}
.l-inst-card{border:1px solid var(--line);padding:24px 24px;display:flex;gap:18px;align-items:flex-start;min-width:0;background:var(--surface)}
.l-inst-ic{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink)}
.l-inst-ic svg{width:21px;height:21px}
.l-inst-card div{display:flex;flex-direction:column;gap:6px;min-width:0}
.l-inst-card h3{font-size:14.5px;font-weight:600;letter-spacing:0;text-transform:none}
.l-inst-card p{font-size:14.5px;color:var(--muted)}
@media (max-width:860px){.l-inst-grid{grid-template-columns:1fr}.l-inst-big{padding:36px 22px}.l-inst-card{padding:20px}}

/* visite ----------------------------------------------------------------------- */
.l-visite{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.l-visite-copy{display:flex;flex-direction:column;gap:16px;min-width:0}
.l-visite-copy .l-status{font-size:13.5px}
.l-visite address{font-style:normal;color:var(--ink-2);font-size:16px;line-height:1.6}
.l-horarios{background:var(--surface);border:1px solid var(--line);padding:28px;min-width:0}
.l-horarios h3{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;letter-spacing:0;text-transform:none;margin-bottom:12px}
.l-horarios h3 svg{width:18px;height:18px;color:var(--gold-ink)}
.l-horarios table{width:100%;border-collapse:collapse;font-size:15px}
.l-horarios th,.l-horarios td{padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.l-horarios td{text-align:right}
.l-horarios tr.hoje th,.l-horarios tr.hoje td{color:var(--gold-ink);font-weight:500}
.l-horarios small{font-size:12px;letter-spacing:0;text-transform:none;padding:2px 6px;background:var(--gold-soft);margin-left:6px}
.l-horarios .l-note{margin-top:14px}
@media (max-width:860px){.l-visite{grid-template-columns:1fr;gap:28px}.l-horarios{padding:20px}}

/* faq --------------------------------------------------------------------------- */
.l-faq{max-width:840px;margin:0 auto;border-top:1px solid var(--line)}
.l-faq details{border-bottom:1px solid var(--line)}
.l-faq summary,.l-acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:19px 2px;cursor:pointer;font-family:var(--display);font-size:19px;color:var(--ink);transition:color .3s,padding .4s var(--ease)}
.l-faq summary::-webkit-details-marker,.l-acc summary::-webkit-details-marker{display:none}
.l-faq summary::after,.l-acc summary::after{content:"+";font-family:var(--body);font-weight:300;font-size:24px;line-height:1;color:var(--gold-ink);transition:transform .35s var(--ease);flex-shrink:0}
.l-faq details[open] summary::after,.l-acc details[open] summary::after{transform:rotate(45deg)}
.l-faq summary:hover{color:var(--gold-ink);padding-left:8px}
.l-ans{padding:0 2px 20px;color:var(--muted);max-width:68ch;display:flex;flex-direction:column;gap:10px}
.l-ans ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.l-ans b{color:var(--ink-2);font-weight:500}
details[open]>.l-ans{animation:lFadeUp .5s var(--ease) both}
@media (max-width:700px){.l-faq summary,.l-acc summary{font-size:17px}}

/* lista vip ------------------------------------------------------------------------ */
.l-news{background:var(--soft);border-top:1px solid var(--line);position:relative;overflow:hidden}
.l-news::before{content:"";position:absolute;right:-50px;bottom:-200px;width:240px;height:320px;border:1px solid var(--gold);border-radius:200px 200px 0 0;opacity:.25;pointer-events:none}
.l-news-in{padding-block:64px;display:grid;grid-template-columns:1fr 1fr;gap:28px 48px;align-items:center;position:relative}
.l-news-copy{display:flex;flex-direction:column;gap:12px;min-width:0}
.l-news-copy h2{font-family:var(--display);font-size:clamp(26px,3vw,38px);line-height:1.15}
.l-news-copy p{color:var(--muted)}
.l-news-form{display:flex;flex-direction:column;gap:12px;min-width:0}
.l-news-row{display:flex}
.l-news-row input{flex:1;min-width:0;padding:14px;border:1px solid var(--ink);border-right:0;background:var(--bg);color:var(--ink);font-size:15px;border-radius:0}
.l-news-row input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.l-news-alt{font-size:13.5px;color:var(--muted)}
.l-news-alt a{color:var(--gold-ink);text-underline-offset:3px}
@media (max-width:760px){.l-news-in{grid-template-columns:1fr;padding-block:48px}.l-news-row{flex-direction:column;gap:8px}.l-news-row input{border-right:1px solid var(--ink)}}

/* rodapé ----------------------------------------------------------------------------- */
.l-foot{background:var(--soft);border-top:1px solid var(--line);font-size:14px}
.l-foot-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1.2fr;gap:32px;padding-block:56px 40px}
.l-foot h4{margin:0 0 14px;font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink)}
.l-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;color:var(--muted)}
.l-foot ul button,.l-foot ul a{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-size:14px;text-align:left;text-decoration:none;transition:color .25s}
.l-foot ul button:hover,.l-foot ul a:hover{color:var(--ink)}
.l-foot-marca .l-brand{align-items:flex-start;text-align:left;margin-bottom:14px}
.l-foot-marca .l-brand-name{font-size:21px;padding-left:0}
.l-foot-marca .l-brand-sub{padding-left:0}
.l-foot-marca .l-brand-sub::before{display:none}
.l-foot-about{color:var(--ink-2);max-width:36ch;margin-bottom:8px}
.l-foot-about.muted{color:var(--muted);font-size:13.5px}
.l-social{display:flex;gap:8px;margin-top:14px}
.l-social a{width:40px;height:40px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;color:var(--gold-ink);transition:border-color .3s,background .3s}
.l-social a:hover{border-color:var(--gold);background:var(--surface)}
.l-social svg{width:18px;height:18px}
.l-foot-atend li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.l-foot-atend li>svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--gold-ink)}
.l-foot-atend .num{color:var(--ink);user-select:all}
.l-foot-atend a{text-decoration:underline!important;text-underline-offset:3px}
.l-pay{border-top:1px solid var(--line)}
.l-pay .l-wrap{padding-block:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;font-size:12.5px;color:var(--muted)}
.l-pay-chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.l-pay-nota{margin-left:auto}
.l-foot-bottom{border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.l-foot-bottom .l-wrap{padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.l-foot-bottom a{color:inherit;text-underline-offset:3px}
.l-area{font-size:13.5px;letter-spacing:0;text-transform:none;text-decoration:none!important;opacity:.7;padding:6px 0}
.l-area:hover{opacity:1;color:var(--gold-ink)}
@media (max-width:960px){.l-foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.l-foot-grid{grid-template-columns:1fr;gap:28px;padding-block:44px 32px}.l-pay-nota{margin-left:0;width:100%}}

/* WhatsApp flutuante ------------------------------------------------------------------- */
.l-wa-float{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--on-btn);padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);text-decoration:none;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;animation:lFloatIn .8s 1.4s var(--ease) both;transition:background .3s,transform .4s var(--ease),bottom .4s var(--ease)}
.l-wa-float svg{width:19px;height:19px}
.l-wa-float:hover{background:var(--gold-ink);transform:translateY(-3px)}
.l-wa-float::before{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--gold);animation:lRing 2.8s 2.4s ease-out infinite;pointer-events:none}
.l-wa-balao{position:absolute;right:0;bottom:calc(100% + 10px);white-space:nowrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm);padding:8px 12px;font-size:12.5px;letter-spacing:.02em;text-transform:none;font-weight:500;opacity:0;pointer-events:none;animation:lBalao 6s 4s var(--ease) both}
.com-barra .l-wa-float{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (max-width:520px){.l-wa-float .lbl{display:none}.l-wa-float{padding:13px}}

/* camadas: gavetas e modais -------------------------------------------------------- */
.l-gfundo,.l-mfundo{position:fixed;inset:0;z-index:60;background:var(--scrim);animation:lFade .3s both}
.l-gfundo.sai,.l-mfundo.sai{animation:lFadeOut .3s both}
.l-drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);outline:none;animation:lSlideIn .5s var(--ease) both}
.l-gfundo.sai .l-drawer{animation:lSlideOut .3s var(--ease-io) both}
.l-d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.l-d-head h2{font-family:var(--display);font-size:24px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.l-d-head h2 small{font-family:var(--body);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.l-d-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.l-d-body{flex:1;overflow:auto;padding:4px 20px 16px;overscroll-behavior:contain}
.l-d-foot{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.l-d-vazio{text-align:center;padding:56px 8px;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.l-d-vazio h3{font-family:var(--display);font-size:22px;color:var(--ink)}
.l-bag-list{list-style:none;margin:0;padding:0}
.l-bag-item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.l-bag-img{display:block}
.l-bag-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.l-bag-nome{font-family:var(--display);font-size:17px;line-height:1.2;text-decoration:none}
.l-bag-nome:hover{color:var(--gold-ink)}
.l-bag-info small{font-size:12.5px;color:var(--muted)}
.l-bag-ctl{display:flex;align-items:center;gap:14px;margin-top:8px}
.l-bag-preco{font-weight:600;font-size:15px;white-space:nowrap}
.l-qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);background:var(--surface)}
.l-qty button{width:44px;height:48px;border:0;background:none;cursor:pointer;font-size:19px;color:var(--ink);transition:background .2s}
.l-qty button:hover:not([disabled]){background:var(--soft)}
.l-qty button[disabled]{color:var(--line-2);cursor:not-allowed}
.l-qty span{min-width:30px;text-align:center;font-weight:600}
.l-qty.peq button{width:34px;height:34px;font-size:17px}
.l-qty.peq span{min-width:24px;font-size:14px}
.l-totals{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.l-totals>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.l-totals strong{font-size:22px;font-weight:600}
.l-pixline{color:var(--gold-ink);font-size:14px;font-weight:500}
.l-note{font-size:13px;color:var(--muted);line-height:1.5}
.l-note a{color:var(--gold-ink)}
.l-note.center{text-align:center}
.l-note svg{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:4px;color:var(--gold-ink)}
.l-hint{font-size:12.5px;color:var(--muted);line-height:1.4}

.l-mfundo{display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.l-modal{position:relative;width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);padding:36px 32px 30px;outline:none;animation:lModalIn .45s var(--ease) both;overscroll-behavior:contain}

.l-mx{position:absolute;top:14px;right:14px;z-index:3}
.l-m-tit{font-family:var(--display);font-size:30px;line-height:1.12;margin:8px 0 14px;padding-right:40px}
