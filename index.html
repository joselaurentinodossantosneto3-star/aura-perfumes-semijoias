  .l-mfundo.sai .l-modal{animation:lSheetDown .3s var(--ease-io) both}
  .l-m-tit{font-size:26px}
}

/* abas (guia e conta) */
.l-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.l-tabs button{border:0;background:none;padding:10px 0;cursor:pointer;font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted);border-bottom:2px solid transparent;flex-shrink:0;margin-bottom:-1px;transition:color .3s,border-color .3s}
.l-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.l-tabs button:hover{color:var(--ink)}
.l-tabpanel{display:flex;flex-direction:column;gap:14px}
.l-guia-intro{color:var(--ink-2);font-size:14.5px}
.l-tab-wrap{overflow-x:auto;border:1px solid var(--line);max-width:100%}
.l-tabela{width:100%;border-collapse:collapse;font-size:14px}
.l-tabela th,.l-tabela td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.l-tabela thead th{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink);background:var(--soft)}
.l-tabela tbody th{font-weight:600}
.l-tabela tbody tr:nth-child(even){background:color-mix(in srgb,var(--soft) 60%,transparent)}
.l-tabela tbody tr:last-child>*{border-bottom:0}
.l-tabela.larga{min-width:560px}
.l-colo{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}
.l-colo svg{width:100%;height:auto;color:var(--muted)}
.l-colo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--ink-2)}
.l-colo b{display:inline-block;min-width:52px;color:var(--gold-ink);font-weight:600}
@media (max-width:520px){.l-colo{grid-template-columns:1fr}.l-colo svg{max-width:220px;margin:0 auto}}

/* ampliar */
.l-modal.l-amp{width:min(900px,100%);padding:20px}
.l-amp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.l-amp-fig{width:min(620px,100%);aspect-ratio:4/5;position:relative;background:radial-gradient(120% 90% at 50% 28%,var(--surface) 0%,var(--soft-2) 82%);border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--line)}
.l-amp-fig img,.l-amp-fig .art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.l-amp-leg{font-size:13px;color:var(--muted);text-align:center}
.l-amp-nav{position:absolute;top:45%;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.l-amp-nav svg{width:18px;height:18px}
.l-amp-nav.ant{left:0}.l-amp-nav.prox{right:0}

/* formulários ----------------------------------------------------------------- */
.l-form{display:flex;flex-direction:column;gap:14px}
.l-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.l-field label{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.l-field label small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.l-field input,.l-field select,.l-field textarea,.l-cupom-campo input{width:100%;min-height:48px;padding:12px 13px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:16px;border-radius:0;transition:border-color .25s,box-shadow .25s}
.l-field textarea{min-height:88px;resize:vertical;line-height:1.45}
.l-field input:focus,.l-field select:focus,.l-field textarea:focus,.l-cupom-campo input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.l-field.erro input,.l-field.erro textarea,.l-cupom-campo input.erro{border-color:var(--sale);box-shadow:0 0 0 3px var(--sale-soft)}
.l-err-msg{font-size:12.5px;color:var(--sale);font-weight:500}
.l-form-erro{font-size:13.5px;color:var(--sale);background:var(--sale-soft);padding:10px 12px}
.l-check{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer;line-height:1.4}
.l-check input{width:19px;height:19px;accent-color:var(--gold-ink);margin:1px 0 0;flex-shrink:0}
.l-check a{color:var(--gold-ink)}

/* catálogo -------------------------------------------------------------------- */
.l-banner{background:var(--soft);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.l-banner::after{content:"";position:absolute;right:6%;bottom:-180px;width:280px;height:360px;border:1px solid var(--gold);border-radius:200px 200px 0 0;opacity:.28;pointer-events:none}
.l-banner .l-wrap{padding-block:30px 40px;position:relative}
.l-banner.curto .l-wrap{padding-block:24px 30px}
.l-crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:14px}
.l-crumb a{color:inherit;text-decoration:none}
.l-crumb a:hover{color:var(--gold-ink);text-decoration:underline;text-underline-offset:3px}
.l-crumb>span:last-child{color:var(--ink-2)}
.l-pv .l-crumb,.l-main>.l-wrap>.l-crumb{margin:22px 0 0}
.l-banner-tit{font-family:var(--display);font-size:clamp(34px,4.6vw,56px);line-height:1.05;letter-spacing:-.01em;animation:lFadeUp .7s var(--ease) both}
.l-banner-sub{margin-top:10px;color:var(--muted);font-size:16px;max-width:60ch;animation:lFade .8s .15s both}
.l-catalogo>.l-wrap{padding-block:36px 40px}
.l-cat-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start}
.l-filtros{outline:none;position:sticky;top:150px;max-height:calc(100vh - 170px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;padding-right:6px;display:flex;flex-direction:column}
.l-f-head{display:none}
.l-f-corpo{display:flex;flex-direction:column;gap:4px}
.l-f-grupo{border:0;border-bottom:1px solid var(--line);margin:0;padding:6px 0 20px;min-width:0}
.l-f-grupo legend{float:left;width:100%;padding:12px 0 12px;font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink)}
.l-f-grupo legend+*{clear:both}
.l-radios{display:flex;flex-direction:column;gap:1px}
.l-radio{display:flex;align-items:center;gap:10px;padding:7px 4px;cursor:pointer;font-size:14.5px;color:var(--ink-2);transition:color .2s}
.l-radio:hover{color:var(--ink)}
.l-radio input{width:17px;height:17px;accent-color:var(--gold-ink);margin:0;flex-shrink:0}
.l-radio span{flex:1}
.l-radio small{font-size:12px;color:var(--muted)}
.l-radio input:checked~span{color:var(--ink);font-weight:500}
.l-chips{display:flex;flex-wrap:wrap;gap:6px}
.l-chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 13px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2);transition:color .25s,border-color .25s,background .25s}
.l-chip:hover{color:var(--ink);border-color:var(--gold)}
.l-chip[aria-pressed="true"],.l-chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.l-chip svg{width:12px;height:12px}
.l-chip-cor i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--surface);border:1px solid var(--line-2)}
.l-f-preco{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.l-f-preco .l-field label{font-size:12px}
.l-f-preco input{min-height:42px;padding:9px 10px;font-size:15px}
.l-f-grupo .l-hint{margin-top:8px}
.l-f-grupo .l-check{margin-top:14px;font-size:14px}
.l-f-pe{display:flex;gap:10px;padding-top:18px}
.l-f-pe .l-btn{display:none}
.l-f-pe .l-btn-ghost{flex:1;min-height:44px;padding-inline:10px;letter-spacing:0;white-space:nowrap}
.l-f-pe .l-btn{white-space:nowrap;padding-inline:12px;letter-spacing:0}
.l-resultados{min-width:0}
.l-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.l-f-abrir{display:none!important}
.l-f-n{letter-spacing:0}
.l-result{font-size:14px;color:var(--muted);margin-right:auto}
.l-sortbox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.l-sortbox select{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14px;padding:9px 30px 9px 11px;min-height:42px;border-radius:0;cursor:pointer}
.l-ativos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:18px}
.l-ativos:empty{display:none}
.l-ativos .l-chip{min-height:32px;text-transform:none;letter-spacing:0;font-size:15px}
.l-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 22px}
.l-grid.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
.l-vazio{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;gap:12px}
.l-vazio h3,.l-vazio h2{font-family:var(--display);font-size:24px;color:var(--ink);font-weight:400}
.l-vazio p{max-width:48ch}
.l-vazio .l-cta{margin-top:8px}
.l-vazio.grande{padding:72px 20px;border:0}
.l-vazio-ic{width:64px;height:64px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink);margin-bottom:4px}
.l-vazio-ic svg{width:26px;height:26px}
.l-achamos{background:var(--soft);border-top:1px solid var(--line)}
.l-achamos-in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.l-achamos-in>p:not(.l-eyebrow){color:var(--muted);max-width:52ch}
.l-achamos .l-wrap{padding-block:64px}
@media (max-width:1100px){.l-grid.quatro{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:960px){
  .l-cat-grid{grid-template-columns:1fr;gap:0}
  .l-filtros{position:fixed;z-index:65;top:0;bottom:0;left:0;width:min(380px,92vw);max-height:none;background:var(--surface);padding:0;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:var(--shadow);transform:translateX(-105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;outline:none}
  .l-filtros.aberto{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
  .l-f-scrim{position:fixed;inset:0;z-index:64;background:var(--scrim);animation:lFade .3s both}
  .l-f-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .l-f-head h2{font-family:var(--display);font-size:24px}
  .l-f-corpo{flex:1;overflow-y:auto;padding:0 18px 16px;overscroll-behavior:contain}
  .l-f-pe{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--soft)}
  .l-f-pe .l-btn{display:inline-flex;flex:1.3}
  .l-f-abrir{display:inline-flex!important;min-height:42px;padding:9px 16px}
  .l-grid,.l-grid.quatro{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:700px){
  .l-grid,.l-grid.quatro{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 12px}
  .l-toolbar{gap:10px}
  .l-result{order:3;width:100%;margin:0}
  .l-sortbox span{display:none}
  .l-sortbox select{max-width:170px}
  .l-banner .l-wrap{padding-block:22px 28px}
  .l-banner::after{right:-60px;width:200px;height:260px;bottom:-150px}
}

/* página da peça ------------------------------------------------------------------- */
.l-pv>.l-wrap{padding-block:22px 64px}
.l-pv-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start}
.l-galeria{position:sticky;top:150px;display:flex;flex-direction:column;gap:14px;min-width:0}
.l-gal-main{position:relative;max-width:560px;width:100%;margin:0 auto}
.l-gal-main .l-frame.grande{box-shadow:var(--shadow-sm);outline:1px solid var(--gold);outline-offset:8px}
.l-gal-main .l-tags{left:16px;bottom:16px}
.l-gal-main.zoom{cursor:zoom-in}
.l-gal-main.zoom-on .l-frame .art,.l-gal-main.zoom-on .l-frame img{transform:scale(1.6);transition:transform .25s ease-out}
.l-gal-main .l-frame .art{transition:transform .5s var(--ease)}
.l-frame.grande .art{animation:lFade .5s both}
.l-gal-amp{position:absolute;right:14px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;transition:border-color .3s}
.l-gal-amp svg{width:16px;height:16px}
.l-gal-amp:hover{border-color:var(--gold)}
.l-thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.l-thumb{position:relative;width:68px;aspect-ratio:4/5;padding:0;border:1px solid var(--line);background:var(--soft);cursor:pointer;overflow:hidden;border-radius:999px 999px 0 0;transition:border-color .3s}
.l-thumb img,.l-thumb .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.l-thumb[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.l-thumb-play{position:absolute;inset:auto 0 6px;display:grid;place-items:center;color:var(--ink)}
.l-thumb-play svg{width:16px;height:16px}
.l-gal-nota{text-align:center;font-size:12.5px;color:var(--muted)}
.l-pv-info{display:flex;flex-direction:column;gap:16px;min-width:0;padding-top:6px}
.l-pv-eb{font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--gold-ink)}
.l-pv-titlinha{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.l-pv-tit{font-family:var(--display);font-size:clamp(32px,3.6vw,46px);line-height:1.08;letter-spacing:-.01em}
.l-fav-txtbtn{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;margin-top:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink-2);transition:border-color .3s,color .3s}
.l-fav-txtbtn svg{width:17px;height:17px}
.l-fav-txtbtn:hover{border-color:var(--gold)}
.l-fav-txtbtn.on{color:var(--sale);border-color:color-mix(in srgb,var(--sale) 40%,var(--line))}
.l-fav-txtbtn.on svg path{fill:currentColor}
.l-pv-desc{color:var(--ink-2);font-size:16px;max-width:56ch}
.l-pv-opcoes{display:flex;flex-direction:column;gap:20px;padding-top:18px;border-top:1px solid var(--line)}
.l-opt{display:flex;flex-direction:column;gap:11px}
.l-opt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.l-opt-lbl{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.l-opt-lbl b{font-weight:600;color:var(--ink);letter-spacing:.06em}
.l-opt-lbl .muted{text-transform:none;letter-spacing:.02em;font-weight:400;font-size:13px}
.l-sw{display:flex;flex-wrap:wrap;gap:8px}
.l-sw-b{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:6px 14px 6px 7px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink-2);transition:border-color .3s,box-shadow .3s}
.l-sw-b i{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent);flex-shrink:0}
.l-sw-b:hover{border-color:var(--gold)}
.l-sw-b[aria-checked="true"]{border-color:var(--ink);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--ink)}
.l-sw-b.sem{color:var(--muted)}
.l-sw-b.sem i{opacity:.45;background-image:linear-gradient(135deg,transparent 46%,var(--muted) 47%,var(--muted) 53%,transparent 54%)!important}
.l-tams{display:flex;flex-wrap:wrap;gap:8px}
.l-tam{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;min-height:52px;padding:6px 12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:15px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;transition:border-color .3s,background .3s,color .3s}
.l-tam small{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.l-tam:hover:not([disabled]){border-color:var(--gold)}
.l-tam[aria-checked="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.l-tam[aria-checked="true"] small{color:var(--gold-hi)}
.l-tam[disabled]{color:var(--muted);cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px);text-decoration:line-through;text-decoration-color:var(--muted)}
.l-opt-erro{font-size:13px;color:var(--sale);font-weight:500}
.l-opt.treme .l-tams{animation:lTreme .5s var(--ease-io)}
.l-pv-compra{display:flex;flex-direction:column;gap:12px}
.l-estq{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.l-estq svg{width:16px;height:16px;flex-shrink:0}
.l-estq.ok{color:var(--ok)}
.l-estq.low{color:var(--warn)}
.l-estq.low::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);animation:lPulso 1.8s ease-in-out infinite}
.l-estq.out{color:var(--sale)}
.l-estq.info{color:var(--muted);font-weight:400}
.l-pv-buy{display:flex;gap:10px}
.l-pv-buy .l-btn{flex:1}
.l-pv-conf{list-style:none;margin:4px 0 0;padding:16px 0;border-block:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;font-size:13.5px;color:var(--ink-2)}
.l-pv-conf li{display:flex;align-items:flex-start;gap:10px;min-width:0}
.l-pv-conf svg{width:18px;height:18px;color:var(--gold-ink);flex-shrink:0;margin-top:1px}
.l-acc{border-top:0}
.l-acc details{border-bottom:1px solid var(--line)}
.l-acc summary{font-size:18px}
.l-acc .l-ans ul{list-style:none;padding:0}
.l-acc .l-ans li{position:relative;padding-left:16px}
.l-acc .l-ans li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.l-rel{border-top:1px solid var(--line);background:var(--soft)}
.l-pbar{display:none}
@media (max-width:900px){
  .l-pv-grid{grid-template-columns:1fr;gap:30px}
  .l-galeria{position:static}
  .l-gal-main{max-width:420px}
  .l-pv-conf{grid-template-columns:1fr}
  .l-pbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:28;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -12px 30px color-mix(in srgb,var(--gold-ink) 10%,transparent);padding:10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gutter-l);transform:translateY(110%);transition:transform .45s var(--ease);visibility:hidden}
  .l-pbar.on{transform:none;visibility:visible}
  .l-pbar-in{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center}
  .l-pbar-mini .l-frame{width:44px}
  .l-pbar-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .l-pbar-txt strong{font-family:var(--display);font-weight:400;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .l-pbar-txt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .l-pbar .l-btn{min-height:46px;padding:12px 18px}
  .com-barra .l-foot-bottom .l-wrap{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){.l-gal-main{max-width:min(300px,78vw)}.l-pv>.l-wrap{padding-top:16px}.l-pv-grid{gap:22px}.l-pv-titlinha{flex-direction:column;gap:8px}.l-fav-txtbtn{margin-top:0}.l-pv-buy .l-btn{padding-inline:14px;letter-spacing:0}.l-gal-main .l-frame.grande{outline-offset:5px}}

/* checkout ------------------------------------------------------------------------- */
.l-ck>.l-wrap{padding-block:34px 72px}
.l-ck-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:44px;align-items:start}
.l-ck-form{display:flex;flex-direction:column;gap:22px;min-width:0}
.l-bloco{border:1px solid var(--line);margin:0;padding:24px 26px 26px;min-width:0;background:var(--surface)}
.l-bloco legend{display:flex;align-items:center;gap:12px;padding:0 10px;margin-left:-10px;font-family:var(--display);font-size:24px}
.l-bloco-n{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:15px;color:var(--gold-ink);background:var(--gold-soft)}
.l-bloco>.l-note{margin:4px 0 14px}
.l-campos{display:grid;gap:14px;margin-top:10px}
.l-campos.dois{grid-template-columns:1fr 1fr}
.l-campos.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.l-field.full{grid-column:1/-1}
.l-field.dois-col{grid-column:span 2}
.l-radios-card{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.l-rcard{position:relative;display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--line-2);cursor:pointer;transition:border-color .3s,background .3s}
.l-rcard:hover{border-color:var(--gold)}
.l-rcard input{position:absolute;opacity:0;width:1px;height:1px}
.l-rmark{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);flex-shrink:0;margin-top:2px;display:grid;place-items:center;background:var(--surface);transition:border-color .3s}
.l-rmark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold-ink);transform:scale(0);transition:transform .3s var(--ease)}
.l-rcard:has(input:checked){border-color:var(--ink);background:var(--soft);box-shadow:0 0 0 1px var(--ink)}
.l-rcard input:checked+.l-rmark{border-color:var(--gold-ink)}
.l-rcard input:checked+.l-rmark::after{transform:scale(1)}
.l-rcard input:focus-visible+.l-rmark{outline:2px solid var(--gold);outline-offset:3px}
.l-rtxt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.l-rtxt b{font-weight:500;font-size:15.5px}
.l-rtxt small{font-size:13px;color:var(--muted);line-height:1.45}
.l-rval{font-weight:600;font-size:14.5px;white-space:nowrap}
.l-rval.gratis{color:var(--ok)}
.l-logos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.l-logos span{border:1px solid var(--line);background:var(--surface);padding:3px 8px;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.l-end{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line-2);animation:lFadeUp .45s var(--ease) both}
.l-resumo{position:sticky;top:150px;border:1px solid var(--line);background:var(--soft);padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.l-resumo h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--display);font-size:24px}
.l-resumo h2 .l-link{font-family:var(--body);font-size:12.5px}
.l-res-itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-height:290px;overflow-y:auto}
.l-res-itens li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}
.l-res-itens b{display:block;font-family:var(--display);font-weight:400;font-size:15.5px;line-height:1.2}
.l-res-itens small{display:block;font-size:12.5px;color:var(--muted)}
.l-res-itens li>span{font-weight:500;font-size:14px}
.l-cupom-campo{display:flex;gap:8px}
.l-cupom-campo input{min-height:42px;padding:9px 12px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.l-cupom-campo input::placeholder{text-transform:none;letter-spacing:0}
.l-cupom-ativo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--gold-soft);border:1px dashed var(--gold);font-size:13.5px}
.l-cupom-ativo span{display:inline-flex;align-items:center;gap:8px}
.l-cupom-ativo svg{width:15px;height:15px;color:var(--gold-ink)}
.l-res-linhas{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line-2);padding-top:14px;font-size:14.5px}
.l-res-linhas>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.l-res-linhas small{color:var(--muted);font-size:12.5px}
.l-res-linhas .total{border-top:1px solid var(--line-2);padding-top:12px;margin-top:3px;font-size:16px;font-weight:600}
.l-res-linhas .total .num{font-size:22px}
.l-verde{color:var(--ok)}
.l-res-pix{font-size:13px;color:var(--ink-2);line-height:1.5}
.l-res-pix:empty{display:none}
.l-res-pix b{color:var(--gold-ink)}
.l-res-seg{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--muted);text-align:center}
.l-res-seg svg{width:15px;height:15px;color:var(--ok);flex-shrink:0}
.l-consent{font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
.l-consent a{color:var(--gold-ink)}
@media (max-width:960px){.l-ck-grid{grid-template-columns:1fr;gap:26px}.l-resumo{position:static}}
@media (max-width:600px){.l-bloco{padding:18px 16px 20px}.l-bloco legend{font-size:21px}.l-campos.dois,.l-campos.tres{grid-template-columns:1fr 1fr}.l-campos.dois .l-field,.l-field.dois-col,.l-campos.tres .l-field{grid-column:1/-1}.l-campos.tres .l-field:nth-child(3),.l-campos.tres .l-field:nth-child(7){grid-column:auto}.l-campos.tres .l-field:nth-child(6){grid-column:auto}.l-rcard{padding:14px 12px;gap:12px}.l-resumo{padding:18px 16px}}

/* sucesso ------------------------------------------------------------------------- */
.l-sucesso{background:linear-gradient(180deg,var(--soft),var(--bg) 340px)}
.l-suc-in{max-width:760px;padding-block:56px 72px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.l-suc-ic{width:76px;height:76px;border-radius:50%;background:var(--whats);color:var(--on-btn);display:grid;place-items:center;box-shadow:0 0 0 8px color-mix(in srgb,var(--whats) 14%,transparent);animation:lPopIn .7s var(--ease) both}
.l-suc-ic.ouro{background:var(--gold-ink);box-shadow:0 0 0 8px var(--gold-soft)}
.l-suc-ic svg{width:34px;height:34px;stroke-width:2.2}
.l-suc-tit{font-family:var(--display);font-size:clamp(34px,5vw,54px);line-height:1.05}
.l-suc-txt{color:var(--ink-2);font-size:16.5px;max-width:54ch}
.l-suc-box{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 26px;padding:14px 24px;border:1px solid var(--gold);background:var(--surface);font-size:15px;outline:1px solid var(--line);outline-offset:4px;margin:6px 0}
.l-suc-box b{font-weight:600;letter-spacing:.04em}
.l-suc-acoes .l-btn-wa.grande{min-width:min(340px,100%)}
.l-suc-msg{width:100%;max-width:520px;text-align:left}
.l-suc-msg summary{cursor:pointer;font-size:13px;color:var(--muted);text-align:center}
.l-suc-msg pre{white-space:pre-wrap;word-break:break-word;font:13.5px/1.55 var(--body);background:var(--soft);border:1px solid var(--line);padding:14px;margin:10px 0 0;user-select:all}
.l-recado{position:relative;width:100%;margin-top:22px;padding:44px 30px 32px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:12px}
.l-recado::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);pointer-events:none}
.l-recado-selo{position:absolute;top:-26px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--gold-hi);display:grid;place-items:center;font:italic 400 24px/1 var(--display);box-shadow:0 0 0 6px var(--bg)}
.l-recado h2{font-family:var(--display);font-size:clamp(24px,3vw,32px);line-height:1.15;max-width:24ch}
.l-recado>p:not(.l-eyebrow){color:var(--muted);max-width:52ch}
.l-assin{font-family:var(--display);font-style:italic;font-size:19px;color:var(--gold-ink)!important}
.l-passos{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;text-align:left}
.l-passos li{display:flex;gap:12px;align-items:flex-start;min-width:0}
.l-passos li>span{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-ink);font-family:var(--display);flex-shrink:0}
.l-passos b{display:block;font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;margin-bottom:3px}
.l-passos p{font-size:13.5px;color:var(--muted)}
.l-marque{font-size:14px;color:var(--ink-2)}
.l-marque a{color:var(--gold-ink);font-weight:500}
.l-confete{position:fixed;inset:0;z-index:90;pointer-events:none;width:100vw;height:100vh}
@media (max-width:700px){.l-passos{grid-template-columns:1fr}.l-recado{padding:40px 18px 26px}.l-suc-in{padding-block:40px 56px}}

/* conta da cliente --------------------------------------------------------------------- */
.l-modal.l-conta{width:min(480px,100%)}
.l-peds{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.l-peds li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.l-peds b{font-weight:600;font-size:14.5px}
.l-peds small{display:block;font-size:12.5px;color:var(--muted)}
.l-pill{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;padding:4px 9px;border-radius:999px;background:var(--soft-2);color:var(--ink-2);white-space:nowrap}
.l-pill.novo{background:var(--info-soft);color:var(--info)}
.l-pill.confirmado{background:var(--gold-soft);color:var(--gold-ink)}
.l-pill.pago,.l-pill.enviado{background:var(--ok-soft);color:var(--ok)}
.l-pill.entregue{background:var(--ok);color:var(--on-btn)}
.l-pill.cancelado{background:var(--sale-soft);color:var(--sale)}
.l-m-edit{margin-top:18px;border:1px solid var(--line);padding:0 14px}
.l-m-edit summary{cursor:pointer;padding:12px 0;font-size:15px;font-weight:600;letter-spacing:0;text-transform:none}
.l-m-edit[open] summary{border-bottom:1px solid var(--line);margin-bottom:14px}
.l-m-edit .l-form{padding-bottom:14px}
.l-m-acoes{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:20px}
.l-m-acoes .l-link{align-self:center}

/* sentimos sua falta ---------------------------------------------------------------- */
.l-modal.l-volta{width:min(760px,100%);padding:0}
.l-volta-grid{display:grid;grid-template-columns:.9fr 1.1fr}
.l-volta-foto{position:relative;background:var(--soft);padding:34px 30px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.l-volta-foto a{display:block;width:100%;max-width:240px}
.l-volta-foto .l-tag{position:absolute;left:18px;top:18px}
.l-volta-txt{padding:40px 32px 30px;display:flex;flex-direction:column;gap:12px}
.l-volta-tit{font-family:var(--display);font-size:28px;line-height:1.15;padding-right:30px}
.l-volta-perg{color:var(--ink-2)}
.l-volta-obg{font-size:13.5px;color:var(--ok);font-weight:500}
.l-volta-cupom{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border:1px dashed var(--gold);background:var(--gold-soft);text-align:center;margin-top:4px}
.l-volta-cupom small{font-size:12.5px;color:var(--gold-ink)}
.l-volta-cupom b{font:500 26px/1.2 var(--display);letter-spacing:.14em}
.l-volta-cupom span{font-size:12px;color:var(--muted)}
.l-volta-acoes{display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (max-width:640px){.l-volta-grid{grid-template-columns:1fr}.l-volta-foto{padding:26px 20px 18px;border-right:0;border-bottom:1px solid var(--line)}.l-volta-foto a{max-width:150px}.l-volta-txt{padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}.l-volta-tit{font-size:23px}.l-modal.l-volta{padding:0}}

/* texto longo (privacidade) ---------------------------------------------------------- */
.l-texto{max-width:820px;display:flex;flex-direction:column;gap:14px;color:var(--ink-2)}
.l-texto h2{font-family:var(--display);font-size:26px;color:var(--ink);margin-top:20px}
.l-texto h2:first-child{margin-top:0}
.l-texto ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.l-texto a{color:var(--gold-ink)}
.l-texto .l-tabela td,.l-texto .l-tabela th{vertical-align:top}

/* revelar ao rolar (só desloca; o conteúdo nunca fica invisível) ----------------------- */
[data-rv]{transform:translate3d(0,36px,0);transition:transform 1.1s var(--ease);transition-delay:calc(var(--d,0)*80ms)}
[data-rv].in{transform:none}
.l-card[data-rv] .l-frame .art{transform:scale(1.12)}
.l-card[data-rv].in .l-frame .art{transform:scale(1);transition:transform 1.6s var(--ease)}
.l-card[data-rv].in .l-media:hover .l-frame .art{transform:scale(1.06);transition-duration:1.2s}

/* abertura da página (só na 1ª montagem) */
.modo-loja.intro .l-aviso{animation:lFade .8s var(--ease) both}
.modo-loja.intro .l-top{animation:lFadeDown .9s .06s var(--ease) both}
.modo-loja.intro .l-brand-sub::before,.modo-loja.intro .l-brand-sub::after{animation:lGrowX 1s .5s var(--ease) both}

@keyframes lFade{from{opacity:0}}
@keyframes lFadeOut{to{opacity:0}}
@keyframes lFadeUp{from{opacity:0;transform:translateY(20px)}}
@keyframes lFadeDown{from{opacity:0;transform:translateY(-14px)}}
@keyframes lDrop{from{opacity:0;transform:translateY(-8px)}}
@keyframes lGrowX{from{transform:scaleX(0)}}
@keyframes lRise{from{transform:translateY(108%)}}
@keyframes lArchIn{from{opacity:0;transform:translateY(64px) scale(.95)}}
@keyframes lFloat{50%{transform:translateY(-10px)}}
@keyframes lRespira{50%{opacity:.75;scale:1.06}}
@keyframes lGlint{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes lTwinkle{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:.9;transform:scale(1.15) rotate(45deg)}}
@keyframes lPop{40%{transform:scale(1.35)}}
@keyframes lPopIn{from{opacity:0;transform:scale(.4)}60%{transform:scale(1.08)}}
@keyframes lSlideIn{from{transform:translateX(100%)}}
@keyframes lSlideOut{to{transform:translateX(100%)}}
@keyframes lModalIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes lModalOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes lSheetUp{from{transform:translateY(100%)}}
@keyframes lSheetDown{to{transform:translateY(100%)}}
@keyframes lFloatIn{from{opacity:0;transform:translateY(30px) scale(.8)}}
@keyframes lRing{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
@keyframes lBalao{0%{opacity:0;transform:translateY(6px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-4px)}}
@keyframes lMq{to{transform:translateX(-50%)}}
@keyframes lPulso{50%{opacity:.45}}
@keyframes lGira{to{transform:rotate(360deg)}}
@keyframes lTreme{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){
  [data-rv],.l-card[data-rv] .l-frame .art{transform:none!important}
  .l-filtros,.l-pbar{transition:none!important}
}

/* ===================== PAINEL (admin + sistema) =====================
   Layout: barra lateral fixa (marfim) com a marca e os grupos de menu; área de trabalho branca com
   cabeçalho da tela (título na serifa de display + ações) e conteúdo em grade. No celular a barra vira gaveta e
   "Nova venda" fica num botão flutuante. */
.modo-painel{--side:252px;background:var(--soft);min-height:100vh;color:var(--ink);font-size:15px}
.p-app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.p-side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--soft);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.p-brand{display:flex;flex-direction:column;gap:6px;padding:4px 10px 20px;text-decoration:none;border-bottom:1px solid var(--line);margin-bottom:12px}
.p-brand b{font:500 16px/1.1 var(--display);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.p-brand span{font-size:10px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-ink);display:flex;align-items:center;gap:8px}
.p-brand span::after{content:"";flex:1;height:1px;background:var(--line-2)}
.p-nav{display:flex;flex-direction:column;gap:14px;flex:1}
.p-grupo{display:flex;flex-direction:column;gap:1px}
.p-grupo>small{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:0 10px 5px}
.p-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;background:none;border:0;border-radius:3px;text-align:left;font-size:14.5px;color:var(--ink-2);text-decoration:none;min-height:38px}
.p-item svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.p-item:hover{background:var(--soft-2);color:var(--ink)}
.p-item[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow-xs)}
.p-item[aria-current="page"] svg{color:var(--gold-ink)}
.p-item .p-cont{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.p-side-pe{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
.p-user{display:flex;align-items:center;gap:10px;padding:6px 10px 12px}
.p-avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--gold-hi);display:grid;place-items:center;font:500 14px/1 var(--display);flex-shrink:0}
.p-user div{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.p-user b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-user small{font-size:12px;color:var(--muted)}

.p-main{min-width:0;display:flex;flex-direction:column}
.p-top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--soft) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px;min-height:62px}
.p-menu-btn{display:none;background:none;border:1px solid var(--line-2);width:40px;height:40px;border-radius:3px;place-items:center;flex-shrink:0}
.p-menu-btn svg{width:20px;height:20px}
.p-titulo{display:flex;flex-direction:column;min-width:0;flex:1}
.p-titulo small{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.p-titulo h1{font:500 26px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.p-conteudo{padding:24px max(24px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.p-demo{font-size:12.5px;color:var(--muted);background:var(--gold-soft);border:1px solid var(--line-2);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-demo b{color:var(--ink);font-weight:500}
.p-scrim{display:none}
.p-btn.p-fab{display:none}
.p-demo svg{width:16px;height:16px;flex-shrink:0;color:var(--gold-ink)}
.p-dica{font-size:12px;color:var(--muted)}

@media (max-width:960px){
  .p-app{grid-template-columns:minmax(0,1fr)}
  .p-side{position:fixed;inset:0 auto 0 0;z-index:60;width:min(300px,86vw);height:100%;transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:var(--shadow);padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .p-app.menu-aberto .p-side{transform:none}
  .p-app.menu-aberto .p-scrim{display:block;position:fixed;inset:0;z-index:55;background:var(--scrim)}
  .p-menu-btn{display:grid}
  .p-top{top:0;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter-r) 10px var(--gutter-l)}
  .p-titulo h1{font-size:21px}
  .p-conteudo{padding:16px var(--gutter-r) calc(96px + env(safe-area-inset-bottom,0px)) var(--gutter-l);gap:16px}
  .p-acoes .p-esconde-mob{display:none}
  .p-btn.p-fab{display:inline-flex;position:fixed;z-index:40;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
}

/* ---------- botões ---------- */
.p-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--on-btn);font-size:13.5px;font-weight:500;letter-spacing:.03em;border-radius:3px;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.p-btn svg{width:17px;height:17px;flex-shrink:0}
.p-btn:hover{background:var(--gold-ink);border-color:var(--gold-ink)}
.p-btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.p-btn.sec:hover{border-color:var(--ink)}
.p-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.p-btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.p-btn.perigo{background:var(--surface);color:var(--sale);border-color:color-mix(in srgb,var(--sale) 40%,var(--line))}
.p-btn.perigo:hover{background:var(--sale);color:var(--on-sale);border-color:var(--sale)}
.p-btn.perigo.cheio{background:var(--sale);color:var(--on-sale);border-color:var(--sale)}
.p-btn.whats{background:var(--whats);border-color:var(--whats);color:#FFFFFF}
.p-btn.whats:hover{filter:brightness(.92)}
.p-btn.txt{background:none;border-color:transparent;color:var(--gold-ink);padding-inline:6px}
.p-btn.txt:hover{color:var(--ink);background:none}
.p-btn.peq{min-height:32px;padding:5px 11px;font-size:12.5px}
.p-btn.grande{min-height:52px;padding:12px 22px;font-size:15px}
.p-btn.full{width:100%}
.p-btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.p-ic-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid transparent;background:none;border-radius:3px;color:var(--muted);flex-shrink:0}
.p-ic-btn svg{width:18px;height:18px}
.p-ic-btn:hover{border-color:var(--line-2);color:var(--ink);background:var(--surface)}

/* ---------- blocos ---------- */
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.p-card>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.p-card h2{font:500 19px/1.2 var(--display)}
.p-card h3{font-size:15px;font-weight:500}
.p-card .p-sub{font-size:13px;color:var(--muted)}
.p-card.flush{padding:0;gap:0}
.p-card.flush>header{padding:16px 20px;border-bottom:1px solid var(--line)}
.p-grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.p-grid>*{grid-column:span 12}
@media (min-width:900px){.p-grid .c3{grid-column:span 3}.p-grid .c4{grid-column:span 4}.p-grid .c5{grid-column:span 5}.p-grid .c6{grid-column:span 6}.p-grid .c7{grid-column:span 7}.p-grid .c8{grid-column:span 8}.p-grid .c9{grid-column:span 9}}
@media (min-width:600px) and (max-width:899px){.p-grid .c3,.p-grid .c4{grid-column:span 6}}
.p-linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.p-linha.entre{justify-content:space-between}
.p-pilha{display:flex;flex-direction:column;gap:10px;min-width:0}
.p-muted{color:var(--muted)}
.p-peq{font-size:13px}
.p-hr{height:1px;background:var(--line);border:0;margin:4px 0}

/* KPIs */
.p-kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.p-kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.p-kpi small{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.p-kpi strong{font-size:26px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-kpi .p-kpi-sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.p-kpi.destaque{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.p-kpi.destaque small,.p-kpi.destaque .p-kpi-sub{color:color-mix(in srgb,var(--on-btn) 70%,transparent)}
.p-kpi.destaque strong{color:var(--gold-hi)}
.p-delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.p-delta.sobe{background:var(--ok-soft);color:var(--ok)}
.p-delta.desce{background:var(--sale-soft);color:var(--sale)}
.p-delta.igual{background:var(--soft-2);color:var(--muted)}

/* pílulas / status */
.p-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.p-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.p-pill.sem-ponto::before{display:none}
.p-pill.ok{background:var(--ok-soft);color:var(--ok)}
.p-pill.alerta{background:var(--warn-soft);color:var(--warn)}
.p-pill.erro{background:var(--sale-soft);color:var(--sale)}
.p-pill.info{background:var(--info-soft);color:var(--info)}
.p-pill.ouro{background:var(--gold-soft);color:var(--gold-ink)}

/* abas e filtros */
.p-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.p-tabs::-webkit-scrollbar{display:none}
.p-tabs button{flex-shrink:0;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:-1px;white-space:nowrap}
.p-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.p-tabs button:hover{color:var(--ink)}
.p-chips{display:flex;gap:6px;flex-wrap:wrap}
.p-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-2);min-height:32px;white-space:nowrap}
.p-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.p-chip:hover{border-color:var(--ink)}
.p-chip .n{font-size:11.5px;opacity:.7;font-variant-numeric:tabular-nums}
.p-periodo{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);overflow:hidden;max-width:100%;overflow-x:auto}
.p-periodo button{border:0;background:none;padding:7px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line)}
.p-periodo button:last-child{border-right:0}
.p-periodo button[aria-pressed="true"]{background:var(--ink);color:var(--on-btn)}
.p-busca{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:3px;padding:0 10px;min-height:40px;min-width:0;flex:1;max-width:420px}
.p-busca svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.p-busca input{border:0;outline:0;background:none;min-width:0;width:100%;font-size:14.5px;padding:8px 0}
.p-busca:focus-within{border-color:var(--gold)}

/* tabelas */
.p-tabela-wrap{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
.p-tabela{width:100%;border-collapse:collapse;font-size:14px}
.p-tabela th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.p-tabela td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.p-tabela tr:last-child td{border-bottom:0}
.p-tabela tbody tr.clic{cursor:pointer}
.p-tabela tbody tr.clic:hover td{background:var(--soft)}
.p-tabela .dir{text-align:right}
.p-tabela .num,.p-tabela td.dir{font-variant-numeric:tabular-nums;white-space:nowrap}
.p-tabela .min{width:1%;white-space:nowrap}
.p-tabela tr.apagada td{color:var(--muted);text-decoration:line-through}
.p-tabela tfoot td{font-weight:600;border-top:1px solid var(--line-2)}
.p-cel-peca{display:flex;align-items:center;gap:10px;min-width:180px}
.p-mini{width:40px;height:50px;flex-shrink:0;border-radius:20px 20px 2px 2px;overflow:hidden;background:var(--soft-2);border:1px solid var(--line);position:relative}
.p-mini svg,.p-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-cel-peca b{font-weight:500;display:block;line-height:1.25}
.p-cel-peca small{color:var(--muted);font-size:12.5px}

/* lista (cards em linha, boa no celular) */
.p-lista{display:flex;flex-direction:column}
.p-lista-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);min-width:0}
.p-lista-item:last-child{border-bottom:0}
.p-lista-item.clic{cursor:pointer}
.p-lista-item.clic:hover{background:var(--soft)}
.p-lista-item .p-li-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.p-lista-item .p-li-txt b{font-weight:500}
.p-lista-item .p-li-txt small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.p-lista-item .p-li-dir{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* vazio */
.p-vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px;color:var(--muted)}
.p-vazio svg{width:40px;height:40px;color:var(--gold)}
.p-vazio b{color:var(--ink);font:500 18px/1.2 var(--display)}
.p-vazio p{max-width:44ch;font-size:14px}

/* formulários */
.p-form{display:flex;flex-direction:column;gap:14px}
.p-campos{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.p-campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.p-campo.largo{grid-column:1/-1}
.p-campo>label,.p-campo>.p-rot{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.p-campo>label .opc{font-weight:400;color:var(--muted)}
.p-input,.p-campo input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),.p-campo select,.p-campo textarea{width:100%;min-height:42px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);padding:9px 11px;font-size:15px;color:var(--ink);outline:none}
.p-campo textarea{min-height:84px;resize:vertical;line-height:1.45}
.p-input:focus,.p-campo input:focus,.p-campo select:focus,.p-campo textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.p-campo .p-dica{font-size:12px;color:var(--muted)}
.p-campo.erro input,.p-campo.erro select,.p-campo.erro textarea{border-color:var(--sale);box-shadow:0 0 0 3px var(--sale-soft)}
.p-campo .p-erro-msg{font-size:12px;color:var(--sale)}
.p-prefixo{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);overflow:hidden}
.p-prefixo span{display:grid;place-items:center;padding:0 10px;background:var(--soft);color:var(--muted);font-size:14px;border-right:1px solid var(--line)}
.p-prefixo input{border:0!important;box-shadow:none!important;min-width:0}
.p-prefixo:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.p-check{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer}
.p-check input{margin-top:3px;accent-color:var(--gold-ink);width:17px;height:17px}
.p-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.p-switch input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s;flex-shrink:0;margin:0;cursor:pointer}
.p-switch input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.p-switch input:checked{background:var(--ok)}
.p-switch input:checked::after{transform:translateX(17px)}
.p-barra-salvar{position:sticky;bottom:0;z-index:10;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-sm)}

/* gráficos (SVG desenhado pelo core) */
.p-graf{width:100%;height:auto;overflow:visible}
.p-graf text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.p-graf .grade{stroke:var(--line);stroke-width:1}
.p-graf .barra{fill:var(--gold)}
.p-graf .barra.forte{fill:var(--ink)}
.p-graf .barra:hover{fill:var(--gold-ink)}
.p-graf .linha{fill:none;stroke:var(--ink);stroke-width:2}
.p-graf .area{fill:var(--gold-soft)}
.p-graf .ponto{fill:var(--gold);stroke:var(--surface);stroke-width:2}
.p-graf .rot-valor{fill:var(--ink);font-weight:500}
.p-barras-h{display:flex;flex-direction:column;gap:10px}
.p-barra-h{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.p-barra-h .trilho{height:10px;background:var(--soft-2);border-radius:999px;overflow:hidden}
.p-barra-h .trilho i{display:block;height:100%;background:var(--gold);border-radius:999px}
.p-barra-h .v{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.p-barra-h span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* modal e confirmação */
.p-modal-fundo{position:fixed;inset:0;z-index:100;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) var(--gutter-r) max(16px,env(safe-area-inset-bottom,0px)) var(--gutter-l);animation:fadeP .2s}
.p-modal{background:var(--surface);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-radius:4px;box-shadow:var(--shadow);animation:sobeP .3s var(--ease)}
.p-modal.largo{width:min(880px,100%)}
.p-modal>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.p-modal>header h2{font:500 20px/1.2 var(--display)}
.p-modal>.p-modal-corpo{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.p-modal>footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft)}
@media (max-width:600px){.p-modal-fundo{align-items:flex-end;padding:0}.p-modal{width:100%;max-height:92vh;border-radius:10px 10px 0 0}.p-modal>footer{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
@keyframes fadeP{from{opacity:0}}
@keyframes sobeP{from{opacity:0;transform:translateY(14px)}}

/* login */
.p-login{min-height:100vh;display:grid;place-items:center;padding:24px var(--gutter-r) 24px var(--gutter-l);background:radial-gradient(120% 70% at 50% 0%,var(--gold-soft),var(--soft) 60%)}
.p-login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:34px 30px 28px;display:flex;flex-direction:column;gap:18px}
.p-login-marca{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:6px}
.p-login-marca .arco{width:56px;height:70px;border:1px solid var(--gold);border-radius:40px 40px 0 0;display:grid;place-items:center;font:500 26px/1 var(--display);color:var(--gold-ink);margin-bottom:6px}
.p-login-marca b{font:500 21px/1.1 var(--display);letter-spacing:.18em;text-transform:uppercase;padding-left:.18em}
.p-login-marca span{font-size:10.5px;font-weight:600;letter-spacing:.36em;text-transform:uppercase;color:var(--gold-ink)}
.p-login-card h1{font:500 22px/1.2 var(--display);text-align:center}
.p-login-erro{background:var(--sale-soft);color:var(--sale);font-size:13.5px;padding:9px 12px;border-radius:3px}
.p-senha{position:relative}
.p-senha input{padding-right:44px!important}
.p-senha button{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.p-login-pe{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.p-login-pe a,.p-login-pe button{color:var(--gold-ink);background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* comprovante (cupom não fiscal) */
.p-recibo{font-family:var(--body);background:var(--surface);border:1px dashed var(--line-2);padding:20px;max-width:380px;margin:0 auto;width:100%;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.p-recibo .cab{text-align:center;display:flex;flex-direction:column;gap:2px}
.p-recibo .cab b{font:500 17px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase}
.p-recibo .lin{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.p-recibo hr{border:0;border-top:1px dashed var(--line-2);margin:4px 0;width:100%}

/* utilidades de variação/acabamento */
.p-bolinha{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.12);vertical-align:-1px}
.p-aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink-2);border:1px solid color-mix(in srgb,var(--warn) 25%,var(--line));padding:10px 12px;border-radius:3px;font-size:13.5px}
.p-aviso.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,var(--line))}
.p-aviso.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,var(--line))}
.p-aviso svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

/* ===================== PAINEL · vendas e clientes (.pv-*) =====================
   PDV em duas colunas (peças/cliente/vendedora × desconto/pagamento/resumo); no celular o
   resumo vira barra fixa embaixo. Cartões de atenção no Início; tabelas e listas do kit. */
.pv-1linha{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv-bloco{display:block}
.pv-nowrap{white-space:nowrap}
.pv-centro{text-align:center;display:flex;justify-content:center}
.pv-erro{color:var(--sale)}
.pv-alerta-txt{color:var(--warn)}
.pv-mais-v{color:var(--ok);font-weight:500}
.pv-menos-v{color:var(--sale);font-weight:500}
.pv-so-mob{display:none}
.pv-h3{font-size:11px!important;font-weight:600!important;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pv-mais{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--line)}
.pv-nota{display:flex;gap:8px;align-items:flex-start;padding:12px 20px;border-top:1px solid var(--line);margin:0}
.pv-nota svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--gold-ink)}
.pv-tab-sub{padding:10px 20px 0}
.pv-col-pecas{max-width:260px}
.pv-col-desc{max-width:240px}
.pv-pos{width:24px;height:24px;border-radius:50%;background:var(--soft-2);color:var(--gold-ink);font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.pv-trilho{display:block;height:6px;background:var(--soft-2);border-radius:999px;overflow:hidden;min-width:60px}
.pv-trilho i{display:block;height:100%;background:var(--gold);border-radius:999px}
.p-tabela tr.pv-eu td{background:var(--gold-soft)}
.p-tabela tr.pv-estornada td{opacity:.6}
.p-tabela tr.pv-estornada td:last-child{opacity:1}
.p-lista-item a:not(.p-btn):not(.p-ic-btn),.p-tabela td a:not(.p-btn):not(.pv-wa-link){color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.p-lista-item a:not(.p-btn):not(.p-ic-btn):hover,.p-tabela td a:not(.p-btn):not(.pv-wa-link):hover{text-decoration-color:var(--gold)}
.p-lista-item.clic:focus-visible,.p-tabela tr.clic:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}

/* ---------- Início ---------- */
.pv-atencao{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pv-aten{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:4px;padding:12px 14px;min-width:0;transition:border-color .2s,box-shadow .2s}
.pv-aten:hover{border-color:var(--gold);box-shadow:var(--shadow-xs)}
.pv-aten>svg:first-child{width:22px;height:22px;color:var(--gold-ink);flex-shrink:0}
.pv-aten span{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
.pv-aten b{font-weight:500;font-size:14px;line-height:1.3}
.pv-aten small{font-size:12.5px;color:var(--muted)}
.pv-aten .pv-aten-seta{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.pv-aten.ouro{border-left-color:var(--gold);background:var(--gold-soft)}
.pv-aten.alerta{border-left-color:var(--warn)}
.pv-aten.alerta>svg:first-child{color:var(--warn)}
.pv-minhas{border-color:var(--gold-hi)}
.pv-rank{display:flex;align-items:center;gap:10px;min-width:200px}
.pv-rank-nome{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.pv-rank-nome b{font-weight:500;display:flex;align-items:center;gap:6px}

/* ---------- PDV ---------- */
.pv-intro{margin-top:-4px}
.pv-pdv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.pv-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.pv-busca-box{position:relative}
.pv-busca-full{max-width:none;width:100%}
.pv-busca-grande{min-height:50px;border-width:1.5px}
.pv-busca-grande svg{width:22px;height:22px;color:var(--ink)}
.pv-busca-grande input{font-size:16px}
.pv-res{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;box-shadow:var(--shadow-sm);list-style:none;margin:0;padding:4px;max-height:420px;overflow-y:auto}
.pv-res li[data-op]{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:3px;cursor:pointer}
.pv-res li[aria-selected="true"]{background:var(--gold-soft)}
.pv-res li[data-op]:hover{background:var(--soft)}
.pv-res li.off{cursor:not-allowed;opacity:.55}
.pv-res .p-mini{width:34px;height:42px}
.pv-res .p-li-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pv-res .p-li-txt b{font-weight:500}
.pv-res .p-li-txt small{color:var(--muted);font-size:12.5px}
.pv-op-dir{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12.5px;color:var(--muted)}
.pv-op-dir b{color:var(--ink);font-size:14px;font-weight:500}
.pv-res-mais{padding:10px;font-size:13px;color:var(--muted)}
.pv-status{min-height:1.4em;margin:-4px 0 0;color:var(--muted)}
.pv-status.ok{color:var(--ok)}
.pv-status.erro{color:var(--sale)}
.pv-itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pv-itens-vazio{border:1px dashed var(--line-2);border-radius:4px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.pv-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto 112px 90px auto;grid-template-areas:"img txt qtd preco sub x";align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pv-item:first-child{border-top:0}
.pv-item>.p-mini{grid-area:img}
.pv-item-txt{grid-area:txt;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.pv-item-txt b{font-weight:500}
.pv-item-txt small{font-size:12.5px;color:var(--muted)}
.pv-item-msg:empty{display:none}
.pv-item-msg{color:var(--gold-ink)!important}
.pv-item-msg.erro{color:var(--sale)!important}
.pv-qtd{grid-area:qtd;display:flex;align-items:center;border:1px solid var(--line-2);border-radius:3px}
.pv-qtd .p-ic-btn{width:32px;height:34px}
.pv-qtd .p-ic-btn[disabled]{opacity:.35;pointer-events:none}
.pv-qtd span{min-width:26px;text-align:center;font-weight:500}
.pv-preco{grid-area:preco;text-align:right}
.pv-preco .p-prefixo span{padding:0 6px;font-size:12.5px}
.pv-preco input{width:100%;min-height:36px;padding:6px 8px;font-size:14px;text-align:right;outline:none;background:none}
.pv-item-sub{grid-area:sub;text-align:right;font-weight:500}
.pv-item-x{grid-area:x}
.pv-cli-sel{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--soft);border-radius:4px;padding:10px 12px}
.pv-cli-sel .p-li-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.pv-cli-sel .p-li-txt b{font-weight:500;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pv-cli-sel .p-li-txt small{font-size:13px;color:var(--muted)}
.pv-cli-res{display:flex;flex-direction:column;gap:4px}
.pv-res-cli{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
.pv-res-cli:hover{border-color:var(--gold)}
.pv-res-cli .p-li-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pv-res-cli .p-li-txt b{font-weight:500}
.pv-res-cli .p-li-txt small{font-size:12.5px;color:var(--muted)}
.pv-res-cb{display:flex;flex-direction:column;align-items:flex-end;font-weight:500;color:var(--gold-ink);font-size:14px}
.pv-res-cb small{font-size:11px;color:var(--muted);font-weight:400}
.pv-cli-novabt{align-self:flex-start}
.pv-cli-nova{border:1px solid var(--line-2);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.pv-cn-erro{color:var(--sale)}
.pv-cn-erro:empty,.pv-upsell:empty{display:none}
.pv-desc{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pv-desc .p-campo{flex:1;min-width:160px}
.pv-desc-bts{display:flex;gap:6px}
.pv-desc-bts .p-btn{min-height:42px}
.pv-pags{display:flex;flex-direction:column;gap:12px}
.pv-pag{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pv-pag .p-rot{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.pv-pag-campos{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pv-pag-campos .p-campo{flex:1;min-width:130px}
.pv-restante{min-height:42px}
.pv-recebido{margin-top:4px}
.pv-pag-status{margin:0}
.pv-pag-status.ok{color:var(--ok)}
.pv-pag-status.erro{color:var(--sale)}
.pv-pag-status.alerta{color:var(--warn)}
.pv-resumo{position:sticky;top:78px;border-color:var(--gold-hi);box-shadow:var(--shadow-xs)}
.pv-res-linhas{display:flex;flex-direction:column;gap:6px}
.pv-res-linhas .lin,.pv-formas-lista .lin,.pv-extrato .lin,.pv-gaveta-res .lin{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:14px}
.pv-res-linhas .pv-total{font-size:20px;font-weight:500;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pv-res-linhas .pv-total span:last-child{font-family:var(--display)}
.pv-res-linhas .pv-falta{color:var(--sale);font-weight:500}
.pv-res-linhas .pv-troco{color:var(--ok);font-weight:500}
.pv-ganha{display:flex;gap:8px;align-items:center;background:var(--gold-soft);color:var(--ink-2);padding:8px 10px;border-radius:3px;font-size:13.5px}
.pv-ganha svg{width:18px;height:18px;color:var(--gold-ink);flex-shrink:0}
.pv-ganha.leve{background:var(--soft)}
.pv-bloq{color:var(--sale);margin:0;min-height:1.2em}
.pv-bloq:empty{display:none}
.pv-barra{display:none}

/* ---------- comprovante ---------- */
.pv-rec-item small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.pv-rec-total{font-size:15.5px}
.pv-acoes-rec{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pv-estorno{border-color:color-mix(in srgb,var(--sale) 30%,var(--line))}
.pv-efeitos{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.pv-formas-lista{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line-2);padding-top:10px}

/* ---------- listas e filtros ---------- */
.pv-filtros-cab{display:flex!important;align-items:flex-end!important;gap:12px!important;flex-wrap:wrap}
.pv-filtros{display:flex;gap:10px;flex-wrap:wrap}
.pv-filtro{min-width:130px}
.pv-filtro select{min-height:40px!important;padding:7px 10px!important;font-size:14px!important}
.pv-formas{display:flex;gap:4px;flex-wrap:wrap}
.pv-forma{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap;color:var(--ink-2)}
.pv-forma.cb{border-color:var(--gold-hi);color:var(--gold-ink);background:var(--gold-soft)}
.pv-chips-linha{padding:12px 20px;border-bottom:1px solid var(--line)}
.pv-wa-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none!important;color:var(--ink-2)}
.pv-wa-link svg{width:16px;height:16px;color:var(--whats)}
.pv-wa-link:hover{color:var(--whats)}
.pv-ic-aniv{display:inline-block;vertical-align:-3px;color:var(--gold-ink)}
.pv-ic-aniv svg{width:16px;height:16px}
.pv-dia{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1.05;border:1px solid var(--gold-hi);border-radius:22px 22px 3px 3px;padding:6px 0 5px;background:var(--gold-soft)}
.pv-dia b{font:500 18px/1 var(--display)}
.pv-dia small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.pv-hora{width:52px;flex-shrink:0;display:flex;flex-direction:column;line-height:1.2}
.pv-hora small{font-size:11.5px;color:var(--muted)}
.pv-wa-msgs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-wa-msgs .p-rot{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pv-extrato{display:flex;flex-direction:column;gap:7px}
.pv-extrato .lin{align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.pv-extrato .lin:last-child{border-bottom:0}
.pv-extrato .lin span{min-width:0}
.pv-regra{font:400 17px/1.4 var(--display);color:var(--ink)}
.pv-exemplo{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pv-conv{display:flex;align-items:center;gap:10px;min-width:150px}
.pv-conv .pv-trilho{flex:1}
.pv-cx-bts{display:flex;gap:8px;flex-wrap:wrap}
.pv-gaveta-res{display:flex;flex-direction:column;gap:6px;background:var(--soft);border:1px solid var(--line);padding:12px;border-radius:4px}
.pv-gaveta-res .pv-total{font-size:17px;font-weight:500;border-top:1px solid var(--line);padding-top:8px}
.pv-gaveta-res .pv-total.ok{color:var(--ok)}
.pv-gaveta-res .pv-total.erro{color:var(--sale)}
.pv-fx-card .p-campo>.p-rot{font-size:12.5px;font-weight:500}
.pv-fx-erro{color:var(--sale)}
.pv-fx-erro:empty{display:none}

/* ---------- celular ---------- */
@media (max-width:1100px){
  .pv-pdv{grid-template-columns:minmax(0,1fr)}
  .pv-resumo{position:static}
}
@media (max-width:960px){
  .pv-esc-mob{display:none}
  .pv-so-mob{display:inline}
  .pv-barra{display:flex;position:fixed;z-index:45;left:0;right:0;bottom:0;align-items:center;gap:12px;padding:10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gutter-l);background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line-2);box-shadow:0 -8px 24px rgba(120,60,70,.08)}
  .pv-barra-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .pv-barra-txt small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pv-barra-txt b{font:500 21px/1.15 var(--display)}
  .pv-barra-bloq{font-size:12px;color:var(--sale);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-barra .p-btn{min-height:48px;padding:10px 18px}
  .pv-resumo [data-finalizar]{display:none}
}
@media (max-width:640px){
  .pv-item{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"img txt x" "img qtd sub" "img preco preco";row-gap:8px}
  .pv-item .pv-qtd{justify-self:start}
  .pv-preco{text-align:left}
  .pv-preco .p-prefixo{max-width:150px}
  .pv-filtros-cab .p-busca{max-width:none;flex-basis:100%}
  .pv-filtro{flex:1;min-width:calc(50% - 6px)}
  .pv-filtros{width:100%}
  .pv-desc-bts{width:100%}
  .pv-desc-bts .p-btn{flex:1}
  .pv-aten b{white-space:normal}
  .pv-cx-bts .p-btn{flex:1}
}
/* ajustes */
.pv-kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.pv-kpis .p-kpi strong{font-size:clamp(21px,1.9vw,25px)}
.pv-kpi-link{min-height:0;padding:0}
.pv-resultado{background:var(--soft);border-style:dashed}
.pv-resultado .p-kpi{background:var(--surface)}
.pv-col-cat{max-width:150px}
.pv-busca-full input{border:0!important;box-shadow:none!important;min-height:0!important;padding:8px 0!important;background:none!important}
.pv-tab-vendas .pv-col-pecas{max-width:210px}
.pv-secao{font:500 19px/1.2 var(--display);margin-bottom:-6px}
.pv-so-cel{display:none!important}
.pv-wa-ic{color:var(--whats)!important}
.p-lista-item.pv-estornada .p-li-txt{opacity:.6}
@media (max-width:640px){
  .pv-so-desk{display:none!important}
  .pv-so-cel{display:flex!important}
  .pv-so-cel .p-lista-item{padding:12px 16px}
  .p-card.flush>header{padding:14px 16px}
  .pv-tab-sub{padding:10px 16px 0}
  .pv-chips-linha{padding:12px 16px}
  .pv-anivs .p-lista-item{flex-wrap:wrap;row-gap:8px}
  .pv-anivs .p-lista-item .p-li-txt{flex:1 1 calc(100% - 60px)}
  .pv-anivs .p-lista-item>.p-btn,.pv-anivs .p-lista-item>.p-peq{margin-left:56px}
}
@media (max-width:640px){
  .pv-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pv-kpis .p-kpi{padding:14px 12px 12px}
  .pv-kpis .p-kpi strong{font-size:20px}
  .pv-kpis .p-kpi small{letter-spacing:.1em}
  .pv-lista-wa .p-lista-item{gap:10px}
  .pv-lista-wa .p-btn.whats{width:40px;min-height:40px;padding:0}
  .pv-lista-wa .pv-wa-rot{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
@media (max-width:640px){
  .pv-esc-cel{display:none}
  .p-cel-peca{min-width:0}
  .p-tabela td,.p-tabela th{padding-left:12px;padding-right:12px}
  .pv-col-pecas{max-width:150px}
}

/* ===================== PAINEL · produtos, estoque, pedidos, loja, equipe =====================
   Complementa o kit do painel (.p-*). Tudo aqui começa com .pp- */

/* textos de botão do cabeçalho: longo no computador, curto no celular */
.pp-curto{display:none}
@media (max-width:600px){.pp-longo{display:none}.pp-curto{display:inline}}

/* no celular a barra de salvar fica embaixo: esconde o "Nova venda" flutuante nas telas de formulário */
@media (max-width:960px){.modo-painel .p-app:has(.pp-barra) .p-fab{display:none}}

/* proteção: o aviso de prévia do núcleo (.p-demo) não define o tamanho do ícone (mover para painel.css) */
.modo-painel .p-demo>svg{width:16px;height:16px;flex-shrink:0;color:var(--gold-ink)}
.modo-painel .p-demo>span{flex:1;min-width:0}
/* proteção: .p-btn (inline-flex) vem depois de .p-fab{display:none} no núcleo e o botão aparecia no desktop */
@media (min-width:961px){.modo-painel .p-fab{display:none}}

.pp-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:2px}
.pp-selos{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pp-preco{font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-preco s{color:var(--muted);font-size:.88em;margin-right:2px}
.pp-preco b{font-weight:500}
.pp-linha-campo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.pp-linha-campo>input{flex:1;min-width:0;min-height:40px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);padding:8px 11px;font-size:15px;outline:none}
.pp-linha-campo>input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.pp-filtros{display:flex;flex-direction:column;gap:10px;min-width:0}
.pp-filtros .p-busca{max-width:none}
@media (min-width:900px){.pp-filtros .p-busca{max-width:520px}}
.pp-hora{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pp-dica-mob{display:none}

/* ---------- lista de peças ---------- */
.pp-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pp-stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:4px;text-align:left;min-width:0}
.pp-stat b{font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.pp-stat small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.pp-stat:hover{border-color:var(--line-2)}
.pp-stat.alerta b{color:var(--warn)}
.pp-stat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.pp-stat[aria-pressed="true"] small,.pp-stat[aria-pressed="true"] b{color:var(--gold-hi)}
@media (max-width:700px){.pp-stats{grid-template-columns:repeat(5,minmax(96px,1fr));overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));padding-inline:var(--gutter-l) var(--gutter-r)}.pp-stats::-webkit-scrollbar{display:none}.pp-stat{padding:10px 12px}.pp-stat b{font-size:20px}}

.pp-pecas{display:flex;flex-direction:column}
.pp-peca{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px) auto auto;align-items:center;gap:8px 18px;padding:12px 20px;border-bottom:1px solid var(--line)}
.pp-peca:last-child{border-bottom:0}
.pp-peca:hover{background:var(--soft)}
.pp-peca.apagada .p-mini,.pp-peca.apagada .pp-nome,.pp-peca.apagada .pp-preco{opacity:.55}
.pp-abrir{display:flex;align-items:center;gap:12px;background:none;border:0;padding:2px 0;text-align:left;min-width:0;color:inherit;border-radius:3px}
.pp-abrir .p-mini{width:48px;height:60px;border-radius:24px 24px 2px 2px}
.pp-abrir-txt{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.35}
.pp-nome{font-weight:500;font-size:15px}
.pp-abrir:hover .pp-nome{color:var(--gold-ink);text-decoration:underline;text-underline-offset:3px}
.pp-meta{font-size:12.5px;color:var(--muted)}
.pp-est{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.pp-est>b{font-weight:500;font-variant-numeric:tabular-nums}
.pp-est>b.zero{color:var(--sale)}
.pp-est-banhos{display:flex;flex-wrap:wrap;gap:3px 10px;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.pp-est-banhos span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pp-est-banhos span.zero{color:var(--sale)}
.pp-sw{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pp-sw-eq{font-size:12.5px;color:var(--muted)}
.pp-ordem{display:flex;gap:2px}
.pp-ordem .p-ic-btn{width:32px;height:32px}
.pp-ordem .p-ic-btn[disabled]{opacity:.3;pointer-events:none}
.pp-nota{text-align:center}
@media (max-width:760px){
