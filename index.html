/* ---------- grade banho × tamanho ---------- */
.pp-grade{border-collapse:separate;border-spacing:4px;font-size:13px;margin:-4px}
.pp-grade th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px;white-space:nowrap;text-align:center}
.pp-grade th.banho{text-align:left;text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--ink-2);padding-right:8px}
.pp-grade th.banho .p-bolinha{margin-right:4px}
.pp-grade td{padding:0;text-align:center}
.pp-grade td.tot,.pp-grade th.tot{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;padding:0 6px}
.pp-cel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;min-height:44px;padding:4px 6px;border-radius:3px;background:var(--soft);border:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.15}
.pp-cel b{font-size:15px;font-weight:500}
.pp-cel small{font-size:10.5px;color:var(--muted)}
.pp-cel.zero{background:var(--sale-soft);border-color:color-mix(in srgb,var(--sale) 25%,var(--line));color:var(--sale)}
.pp-cel.min{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,var(--line));color:var(--warn)}
.pp-cel.off{background:none;border-style:dashed;color:var(--muted)}
.pp-legenda{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pp-legenda .pp-cel{display:inline-flex;min-width:26px;min-height:22px;padding:0 6px}
.pp-legenda .pp-cel b{font-size:12px}

/* ---------- estoque ---------- */
.pp-kpi-btn{display:flex;padding:0;border:0;background:none;text-align:left;border-radius:4px}
.pp-kpi-btn .p-kpi{flex:1;transition:border-color .2s}
.pp-kpi-btn:hover .p-kpi{border-color:var(--line-2)}
.pp-kpi-alerta strong{color:var(--warn)}
.pp-kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pp-kpis .p-kpi strong{font-size:clamp(19px,1.6vw,24px)}
.pp-est-lista{display:flex;flex-direction:column;gap:12px}
.pp-est-card{gap:12px;padding:16px 18px}
@media (min-width:1100px){.pp-est-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.pp-est-lista>.pp-legenda{grid-column:1/-1}}

.pp-est-card.apagada{background:var(--soft)}
.pp-est-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pp-est-tit{flex:1;min-width:180px;display:flex;flex-direction:column;line-height:1.35}
.pp-est-tit b{font-weight:500;font-size:15.5px}
.pp-est-tit small{color:var(--muted);font-size:12.5px}
.pp-est-acoes{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pp-li-acoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pp-mv-filtros{display:flex;flex-direction:column;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.pp-mv-sel{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;max-width:640px}
.pp-mv td{vertical-align:top}
.pp-mv .p-cel-peca{min-width:200px}
.pp-mv .pp-q{font-weight:600}
.pp-q.pos{color:var(--ok)}
.pp-q.neg{color:var(--sale)}
.pp-mot{min-width:160px;font-size:13.5px;color:var(--ink-2)}
.pp-mot a{color:var(--gold-ink)}
.pp-mais{display:flex;justify-content:center;padding:14px}
.pp-mob-acoes{display:none}
@media (max-width:960px){.pp-mob-acoes{display:flex;gap:8px;justify-content:flex-end;margin-bottom:-6px}}
@media (max-width:600px){
  .pp-mv-filtros{padding:12px 16px}
  .pp-mv-sel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pp-est-card{padding:14px}
  .pp-est-acoes{width:100%}
}

/* ---------- modal de entrada ---------- */
.pp-ent-abas{margin-top:-6px}
.pp-ent-rot{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.pp-ent-vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pp-ent-var{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:3px;padding:6px 6px 6px 10px;background:var(--soft)}
.pp-ent-var label{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.pp-ent-var label span{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pp-ent-var label small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.pp-ent-var input{width:72px;min-height:38px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);padding:6px 8px;font-size:15px;text-align:center;font-variant-numeric:tabular-nums;outline:none}
.pp-ent-var input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.pp-ent-add{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pp-ent-add .p-campo{max-width:200px}
.pp-ent-lista{border:1px solid var(--line);border-radius:4px;background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.pp-ent-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pp-ent-cab h3{font:500 16px/1.2 var(--display)}
.pp-ent-it{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.pp-ent-it:first-child{border-top:0}
.pp-ent-it-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pp-ent-it-txt b{font-weight:500;font-size:14px}
.pp-ent-it-txt small{color:var(--muted);font-size:12.5px}
.pp-qtd{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:3px;background:var(--surface)}
.pp-qtd .p-ic-btn{width:32px;height:34px}
.pp-qtd input{width:46px;border:0;text-align:center;font-size:15px;font-variant-numeric:tabular-nums;background:none;outline:none;-moz-appearance:textfield}
.pp-qtd input::-webkit-inner-spin-button,.pp-qtd input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pp-ent-status{font-size:13.5px;min-height:20px}
.pp-ent-status.ok{color:var(--ok)}
.pp-ent-status.erro{color:var(--sale)}
.pp-ent-desp{display:flex;flex-direction:column;gap:10px}
.pp-ent-desp .p-campo{max-width:240px}
.pp-dif{font-size:14px;color:var(--ink-2);min-height:21px;font-variant-numeric:tabular-nums}
.pp-dif .neg,.pp-margem .neg{color:var(--sale)}
.pp-dif .pos{color:var(--ok)}
@media (max-width:600px){.pp-ent-vars{grid-template-columns:minmax(0,1fr)}.pp-ent-it .p-mini{display:none}}

/* ---------- etiquetas (EAN-13) ---------- */
.pp-etqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pp-etq{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 10px 10px;border:1px dashed var(--line-2);border-radius:3px;background:var(--surface);text-align:center;color:var(--ink);break-inside:avoid}
.pp-etq>b{font-weight:500;font-size:13.5px;line-height:1.2}
.pp-etq>small{font-size:12px;color:var(--ink-2)}
.pp-etq>strong{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pp-ean{width:100%;max-width:190px;height:auto;margin:6px 0 2px;color:var(--ink)}
.pp-ean text{font-family:var(--body);font-size:8.5px;fill:currentColor}
.pp-etq-cod{font-variant-numeric:tabular-nums;letter-spacing:.06em;margin:8px 0 2px}
.pp-etq-aviso{font-size:11.5px;color:var(--warn)}
@media (max-width:600px){.pp-etqs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pp-etq{padding:10px 6px 8px}}

/* ---------- consulta da peça (equipe) ---------- */
.pp-cons{display:flex;gap:14px;align-items:center}
.pp-cons-mini .p-mini{width:64px;height:80px;border-radius:32px 32px 2px 2px}
.pp-cons-txt{display:flex;flex-direction:column;gap:2px}
.pp-cons-txt small{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.pp-cons-txt .pp-preco{font-size:19px}
.pp-cons-cods ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.pp-cons-cods li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pp-cons-cods li span{display:flex;align-items:center;gap:6px}
.pp-cons-cods code{font-family:var(--body);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--ink-2)}

/* ---------- formulário da peça ---------- */
.pp-form{display:flex;flex-direction:column;gap:20px}
.pp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,330px);gap:20px;align-items:start}
.pp-col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1100px){
  .pp-cols{display:flex;flex-direction:column;gap:16px}
  .pp-col{display:contents}
  .pp-o1{order:1}.pp-o2{order:2}.pp-o3{order:3}.pp-o4{order:4}.pp-o5{order:5}.pp-o6{order:6}
}
.pp-form h2 .p-sub{font:400 13px/1 var(--body);margin-left:6px}
.pp-margem{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font-size:13.5px;color:var(--ink-2);background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:9px 12px;font-variant-numeric:tabular-nums}
.pp-margem b{font-weight:600;color:var(--ink)}
.pp-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.pp-presets small{font-size:12px;color:var(--muted);margin-right:2px}
.pp-outro{margin-top:4px;max-width:380px}
.pp-arte-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pp-arte{width:120px;aspect-ratio:4/5;border-radius:60px 60px 3px 3px;overflow:hidden;background:var(--soft-2);border:1px solid var(--line);position:relative;flex-shrink:0}
.pp-arte svg{position:absolute;inset:0;width:100%;height:100%}
.pp-arte-txt{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px}
.pp-arte-txt .p-chip{font-size:12.5px;min-height:30px}
.pp-fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pp-foto{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pp-foto-img{position:relative;aspect-ratio:4/5;border-radius:40px 40px 3px 3px;overflow:hidden;background:var(--soft-2);border:1px solid var(--line)}
.pp-foto-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pp-capa{position:absolute;left:6px;bottom:6px;background:var(--ink);color:var(--gold-hi);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.pp-capa.n{background:var(--surface);color:var(--ink-2);letter-spacing:0;border:1px solid var(--line)}
.pp-foto-acoes{display:flex;justify-content:center;gap:0;flex-wrap:wrap}
.pp-foto-acoes .p-ic-btn{width:30px;height:30px}
.pp-foto-acoes .p-ic-btn svg{width:16px;height:16px}
.pp-foto-acoes .p-ic-btn[disabled]{opacity:.3;pointer-events:none}
.pp-video{width:100%;max-height:320px;background:var(--ink);border-radius:3px}
.pp-vars{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pp-var-cab,.pp-var{display:grid;grid-template-columns:minmax(120px,1fr) 156px 96px 64px 46px;gap:10px;align-items:center;padding:8px 12px}
.pp-var-cab{background:var(--soft);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.pp-var{border-bottom:1px solid var(--line)}
.pp-var:last-child{border-bottom:0}
.pp-var.off{background:var(--soft)}
.pp-var.off .pp-var-nome{opacity:.55}
.pp-var-nome{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;min-width:0}
.pp-var-nome b{font-weight:500}
.pp-var-nome span{color:var(--ink-2)}
.pp-var .p-campo input{min-height:38px;padding:7px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.pp-var .pp-v-cod input{font-size:13.5px;letter-spacing:0;padding-inline:8px}
.pp-est-atual{display:flex;align-items:center;gap:2px;min-height:38px}
.pp-est-atual b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;min-width:22px}
.pp-v-at{justify-content:center}
.pp-rm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pp-grade-pe{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pp-min-todas{font-size:13px;color:var(--ink-2)}
.pp-min-todas input{flex:0 0 70px;width:70px;min-height:32px;padding:4px 8px}
@media (max-width:700px){
  .pp-var-cab{display:none}
  .pp-var{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px 10px;padding:12px}
  .pp-var-nome{grid-column:1/-1}
  .pp-v-cod{grid-column:1/-1}
  .pp-v-at{grid-column:3;grid-row:3;align-self:end;padding-bottom:8px}
  .pp-var .pp-rm{position:static;width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;font-size:12px;color:var(--muted)}
  .pp-v-at.p-switch{flex-direction:column-reverse;gap:4px}
  .pp-fotos{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
}
.pp-barra{justify-content:space-between;align-items:center}
.pp-barra-esq{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){
  .pp-barra{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;margin-inline:calc(-1 * var(--gutter-l) + 4px) calc(-1 * var(--gutter-r) + 4px)}
  .pp-barra .p-btn{min-height:40px;padding:8px 12px}
  .pp-barra>.p-btn[type=submit]{flex:1}
  .pp-barra-esq{flex:1 1 100%;order:2;justify-content:space-between}
  .pp-barra-esq .p-btn{flex:1;padding-inline:8px;font-size:12.5px}
}

/* ---------- pedidos ---------- */
.pp-pd-cards{display:none}
.pp-pd-card{width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.pp-pd-card .p-li-dir{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pp-pd-card .p-li-dir b{font-weight:500}
@media (max-width:700px){.pp-pd-tab{display:none}.pp-pd-cards{display:flex}.pp-pd-card{padding:12px 16px}}
.pp-pd-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pp-pd-st{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pp-pd-bts{gap:8px}
@media (max-width:600px){.pp-pd-bts{width:100%}.pp-pd-bts .p-btn{flex:1 1 auto}}
.pp-falta{color:var(--sale)!important}
.pp-totais{display:flex;flex-direction:column;gap:6px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);font-size:14px}
.pp-totais>div{display:flex;justify-content:space-between;gap:12px}
.pp-totais .tot{font-size:17px;font-weight:600;padding-top:6px;border-top:1px solid var(--line-2)}
.pp-pd-cli{display:flex;flex-direction:column;gap:2px}
.pp-pd-cli b{font-weight:500;font-size:16px}
.pp-pd-cli span{color:var(--ink-2);font-size:14px}
.pp-obs{white-space:pre-wrap;font-size:14px;background:var(--gold-soft);padding:10px 12px;border-radius:3px}
.pp-tempo{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.pp-tempo li{position:relative;padding:0 0 14px 22px;display:flex;flex-direction:column;line-height:1.3}
.pp-tempo li::before{content:"";position:absolute;left:0;top:3px;width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.pp-tempo li::after{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line-2)}

.pp-tempo li:last-child::after{display:none}
.pp-tempo li.fut{color:var(--muted)}

.pp-tempo li.erro::before{background:var(--sale);box-shadow:0 0 0 3px var(--sale-soft)}
.pp-tempo b{font-weight:500;font-size:14px}
.pp-tempo small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- recuperar carrinhos ---------- */
.pp-rec-grupo{display:flex;flex-direction:column;gap:10px}
.pp-rec-grupo>header{display:flex;align-items:baseline;gap:10px}
.pp-rec-grupo h2{font:500 19px/1.2 var(--display)}
.pp-rec-grupo .p-sub{font-size:13px;color:var(--muted)}
.pp-rec-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.pp-rec{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:0}

.pp-rec.contatada{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.pp-rec.ok{background:var(--soft)}
.pp-rec-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pp-rec-nome{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pp-rec-nome b{font-weight:500;font-size:15px}

.pp-rec-itens{font-size:13.5px;color:var(--ink-2)}
.pp-rec-meta{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:13.5px}

.pp-rec-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pp-rec-ign summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}
.pp-rec-ign[open] summary{margin-bottom:10px}
@media (max-width:600px){.pp-rec{padding:12px;gap:10px}.pp-rec .p-mini{width:44px;height:56px}}

/* ---------- configurações da loja ---------- */
.pp-indice{display:flex;gap:4px 6px;flex-wrap:wrap;position:sticky;top:62px;z-index:9;background:color-mix(in srgb,var(--soft) 94%,transparent);backdrop-filter:blur(6px);padding:8px 0;margin:-8px 0 -4px;border-bottom:1px solid var(--line)}
.pp-indice a{font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:var(--surface);white-space:nowrap}

@media (max-width:960px){.pp-indice{top:61px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));padding-inline:var(--gutter-l) var(--gutter-r)}.pp-indice::-webkit-scrollbar{display:none}}
.pp-loja .p-card{scroll-margin-top:120px}
.pp-mp{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--gold);padding-left:12px}
.pp-cfg-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px}
.pp-cfg-it{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.pp-cfg-it:last-child{border-bottom:0}
.pp-cfg-foto{display:flex;flex-direction:column;align-items:center;gap:0}
.pp-cfg-foto img,.pp-cfg-foto>span{width:56px;height:70px;border-radius:28px 28px 2px 2px;object-fit:cover;background:var(--soft-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.pp-cfg-foto>span svg{width:20px;height:20px}
.pp-cfg-foto .p-btn{min-height:26px;padding:2px 4px;font-size:12px}
.pp-cfg-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:8px 12px;align-items:end;min-width:0}
.pp-cfg-campos .p-dica{grid-column:1/-1}
.pp-cfg-bts{display:flex;gap:2px;align-items:center}
.pp-cfg-bts .p-ic-btn[disabled]{opacity:.3;pointer-events:none}
.pp-cfg-faixa{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--soft)}
.pp-cfg-faixa+.pp-cfg-faixa{margin-top:10px}
.pp-cfg-faixa>.pp-linha-campo{justify-content:space-between}
.pp-dias .p-chip{min-width:44px;justify-content:center;padding-inline:8px}
.pp-passos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pp-passo{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--soft);position:relative}
.pp-passo-n{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:500 14px/1 var(--display)}
.pp-passo textarea{min-height:64px}
@media (max-width:800px){.pp-passos{grid-template-columns:minmax(0,1fr)}}
.pp-cups{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px}
.pp-cup{display:grid;grid-template-columns:minmax(110px,160px) 110px minmax(0,1fr) auto;gap:10px;align-items:end;padding:10px 12px;border-bottom:1px solid var(--line)}
.pp-cup:last-child{border-bottom:0}
.pp-cup-bts{display:flex;align-items:center;gap:8px;min-height:42px}
.pp-cup .p-campo input{text-transform:none}
.pp-cup [data-k="codigo"]{text-transform:uppercase;letter-spacing:.04em}
@media (max-width:700px){
  .pp-cfg-it{grid-template-columns:64px minmax(0,1fr);align-items:start}
  .pp-cfg-bts{grid-column:1/-1;justify-content:flex-end}
  .pp-cup{grid-template-columns:minmax(0,1fr) 100px}
  .pp-cup-desc{grid-column:1/-1}
  .pp-cup-bts{grid-column:1/-1;justify-content:space-between}
}
.pp-rc-prev{display:flex;flex-direction:column;gap:6px}
.pp-bolha{align-self:flex-start;max-width:440px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 18%,var(--line));border-radius:10px 10px 10px 2px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- equipe ---------- */
.pp-u.apagada .p-avatar{opacity:.4}
.pp-u.apagada .p-li-txt b{color:var(--muted)}
.pp-barrinha{display:block;height:4px;border-radius:99px;background:var(--soft-2);margin-top:5px;max-width:160px;overflow:hidden}
.pp-barrinha i{display:block;height:100%;background:var(--gold);border-radius:99px}
.pp-pode{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pp-pode ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.pp-pode li{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.pp-pode li svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.pp-pode ul.ok svg{color:var(--ok)}
.pp-pode ul.nao svg{color:var(--sale)}
.pp-radio{cursor:pointer}
.pp-radio input{position:absolute;opacity:0;width:1px;height:1px}
.pp-radio:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-btn)}
.pp-radio:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.pp-radio:has(input:disabled){opacity:.55;cursor:not-allowed}
@media (max-width:600px){.pp-pode{grid-template-columns:minmax(0,1fr)}.pp-u{flex-wrap:wrap}.pp-u .pp-li-acoes{width:100%;justify-content:flex-start;padding-left:0;gap:2px;flex-wrap:nowrap}.pp-u .pp-li-acoes .p-btn{padding-inline:8px}}

/* ---------- conta ---------- */
.pp-conta-cab{display:flex;gap:14px;align-items:center}
.pp-conta-cab div{display:flex;flex-direction:column;line-height:1.35}
.pp-conta-cab b{font-weight:500;font-size:17px}
.pp-conta-cab small{color:var(--muted);font-size:13px}
.pp-conta-cab small b{font-size:13px;color:var(--ink-2)}
.pp-avatar-g{width:52px;height:52px;font-size:21px}
.pp-dl{margin:0;display:flex;flex-direction:column;gap:0}
.pp-dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pp-dl dt{color:var(--muted)}
.pp-dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.pp-perigo{border-color:color-mix(in srgb,var(--sale) 22%,var(--line))}
@media (max-width:600px){.pp-barra-esq:has(>:only-child){flex:0 0 auto;order:0}.pp-barra-esq:has(>:only-child) .p-btn{flex:none;padding-inline:14px}}
#pp-est-corpo{display:flex;flex-direction:column;gap:14px;min-width:0}
.p-card>.pp-est-cab{align-items:center;justify-content:flex-start}
.modo-painel .p-chip svg{width:14px;height:14px;flex-shrink:0}
.pp-cons-mini{display:flex;flex-shrink:0}
@media (max-width:600px){.pp-cel{min-width:44px;min-height:40px;padding:3px 4px}.pp-cel b{font-size:14px}.pp-grade{border-spacing:3px}.pp-grade th.banho{padding-right:4px;font-size:12.5px}}
/* .p-dica só tem estilo dentro de .p-campo no núcleo; aqui vale também solta nos cards e modais */
#painel .p-dica,.p-modal .p-dica{font-size:12.5px;color:var(--muted);line-height:1.45}
@media (max-width:600px){.pp-cfg-faixa>.p-campos{grid-template-columns:repeat(2,minmax(0,1fr))}.pp-cfg-faixa>.p-campos>.p-campo:first-child,.pp-cfg-faixa>.p-campos>.p-campo.largo{grid-column:1/-1}}

/* ===================== AURA · identidade própria =====================
   Halo: cada peça pousa sobre uma luz suave (rosé, pêssego, lilás) em moldura de cantos arredondados.
   Pílulas nos botões e nas categorias, títulos em serifa macia, tudo em caixa normal e alinhado à esquerda. */

/* tipo */
.l-hero-tit{font-weight:300;font-size:clamp(40px,5.5vw,74px);line-height:1.03;letter-spacing:-.022em}
.l-h2{font-weight:340;letter-spacing:-.018em;margin-top:0}
.l-h3{font-weight:400}
.modo-loja h1,.modo-loja h2{font-optical-sizing:auto}
.modo-loja h1 em,.modo-loja h2 em{font-style:normal;color:inherit}
.l-eyebrow{font-weight:500}
.l-lede{max-width:46ch}

/* marca: nome curto, em minúsculas e itálico leve */
.l-brand-name{font:italic 300 42px/.9 var(--display);letter-spacing:-.01em;text-transform:lowercase;padding-left:0}
.l-top.rolou .l-brand-name{font-size:34px}
.l-brand-sub{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:none;color:var(--muted);margin-top:5px;padding-left:0;gap:0}
.l-brand-sub::before,.l-brand-sub::after{display:none}
.l-top.rolou .l-brand-sub{margin-top:3px}
@media (max-width:860px){.l-brand-name{font-size:34px;letter-spacing:-.01em}.l-top.rolou .l-brand-name{font-size:29px}.l-brand-sub{font-size:10.5px;letter-spacing:.06em;margin-top:4px}}
@media (max-width:420px){.l-brand-name{font-size:30px;letter-spacing:-.01em}.l-brand-sub{font-size:10px}}
.l-foot-marca .l-brand-name{font-size:40px;padding-left:0}

/* faixa do topo: escura, para a luz do resto aparecer */
.l-aviso{background:var(--ink);color:#FFFFFF;border-bottom:0;font-size:12.5px;font-weight:500}
.l-aviso-in{min-height:34px}

/* menu */
.l-catnav-in>button{font-size:14.5px;font-weight:500}
.l-catnav-in>button::after{height:2px;border-radius:2px;bottom:3px}
@media (max-width:420px){.l-catnav-in>button{font-size:13.5px}}
.l-mega-item{border-radius:18px}
.l-mega-item strong{font-size:14.5px}
.l-mega-ini{font-style:normal}

/* botões e controles em pílula */
.l-btn,.l-btn-ghost,.l-btn-wa{border-radius:999px;font-weight:500;padding-inline:28px}
.l-btn-ghost{border-color:var(--line-2)}
.l-btn-ghost:hover{border-color:var(--ink)}
.l-btn-ghost.peq,.l-btn.peq{padding-inline:16px}
.l-buy{border-radius:999px;border-color:var(--line-2)}
.l-buy:hover,.l-buy.ok{border-color:var(--btn)}
.l-rail-nav button{border-radius:50%}
.l-tag{border-radius:999px;padding:4px 10px;font-weight:500}
.l-pay-chip,.l-chip,.l-pill,.l-logos span{border-radius:999px}
.l-gal-amp{border-radius:999px;padding-inline:14px}
.l-tam{border-radius:12px}
.modo-loja input:not([type=checkbox]):not([type=radio]):not([type=range]),.modo-loja select,.modo-loja textarea{border-radius:var(--r-campo)}
.toast{border-radius:16px}

/* halo: moldura das peças */
.l-frame{border-radius:var(--r-frame);border:0;background:var(--halo)}
.l-frame.mini{border-radius:12px}
.l-card:hover .l-media .l-frame{box-shadow:0 22px 46px -22px rgba(70,52,36,.45)}
.l-gal-main .l-frame.grande{border-radius:34px;outline:0;box-shadow:0 34px 80px -34px rgba(70,52,36,.4)}
.l-cat-circle{border:0;background:var(--halo)}
.l-cat{color:var(--gold-ink)}

/* hero: um halo grande com a peça em destaque e duas menores em órbita */
.l-hero{border-bottom:0;background:
  radial-gradient(46% 72% at 76% 44%,var(--aura-1) 0,rgba(237,229,220,0) 70%),
  radial-gradient(38% 62% at 98% 84%,var(--aura-3) 0,rgba(227,217,206,0) 70%),
  radial-gradient(40% 58% at 56% 104%,var(--aura-2) 0,rgba(245,239,233,0) 72%),
  var(--bg)}
.l-hero-glow{display:none}
.l-hero-in{grid-template-columns:1.05fr 1fr;padding-block:72px 84px}
.l-hero-eb{align-self:flex-start;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;color:var(--gold-ink)}
.l-hero-eb::before{display:none}
.l-hero-art{grid-template-columns:.66fr 1.5fr .66fr;align-items:center;gap:0;padding:10px 6px 0}
.l-arch{gap:16px}
.l-arch .l-frame{aspect-ratio:1;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 1px rgba(177,160,144,.45)}
.l-arch-1{margin:0 -30% -58% 0;z-index:2}
.l-arch-3{margin:-58% 0 0 -30%;z-index:2}
.l-arch-2{margin:0}
.l-arch-2 .l-frame{outline:0;box-shadow:0 0 0 16px rgba(255,255,255,.55),0 0 0 17px rgba(177,160,144,.5),0 44px 90px -30px rgba(70,52,36,.45)}
.l-arch-1 figcaption,.l-arch-3 figcaption{display:none}
.l-arch figcaption{font-size:13.5px;color:var(--ink-2)}
@media (max-width:860px){.l-hero-in{grid-template-columns:1fr;padding-block:44px 64px}.l-hero-art{max-width:440px;margin-inline:auto;width:100%}}

/* seções */
.l-sec>.l-wrap{padding-block:72px}
.l-sec-soft{border-block:0}
.l-sec-head{margin-bottom:28px}

/* categorias em pílula */
.l-cats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.l-cat-tile{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"c n" "c q";column-gap:14px;row-gap:1px;align-items:center;justify-items:start;padding:8px 20px 8px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:border-color .3s,box-shadow .5s var(--ease),transform .5s var(--ease)}
.l-cat-tile:hover{border-color:var(--gold);box-shadow:0 14px 30px -18px rgba(70,52,36,.5);transform:translateY(-2px)}
.l-cat-tile .l-cat-circle{grid-area:c;width:60px}
.l-cat-tile:hover .l-cat-circle{box-shadow:none}
.l-cat-tile .l-cat-name{grid-area:n;align-self:end;font:400 18px/1.2 var(--display);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-cat-tile .l-cat-count{grid-area:q;align-self:start;margin-top:0;font-size:13px}
@media (max-width:700px){.l-cats{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;grid-auto-columns:auto;overflow:visible;gap:10px;padding:0;margin-inline:0}.l-cat-tile{padding:6px 12px 6px 6px;column-gap:10px}.l-cat-tile .l-cat-circle{width:46px}.l-cat-tile .l-cat-name{font-size:16px}.l-cat-tile .l-cat-count{font-size:12.5px}}

/* ocasiões */
.l-oc-arch{aspect-ratio:1;border-radius:var(--r-frame);border:0;background:var(--halo)}
.l-oc-ini{display:none}
.l-oc-arch .art{left:9%;right:9%;top:5%;bottom:auto;width:82%;height:90%}
.l-oc-txt strong{order:-1;font-weight:400}
.l-oc-txt em{font:400 14.5px/1.4 var(--body);font-style:normal;color:var(--muted)}

/* como comprar: três cartões em sequência */
.l-steps{border:0;gap:14px}
.l-step{align-items:flex-start;text-align:left;background:var(--soft);border-radius:var(--r-card);padding:28px 26px 30px}
.l-step+.l-step{border-left:0}
.l-step-n{width:46px;height:46px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line-2);font-size:20px;margin-bottom:6px}
.l-step h3{font:400 21px/1.2 var(--display)}
.l-step p{max-width:34ch}
.l-cta.center{justify-content:flex-start}

/* a loja */
.l-inst-big{border:0;outline:0;border-radius:32px;background:
  radial-gradient(60% 80% at 96% 0%,var(--aura-3) 0,rgba(227,217,206,0) 70%),
  radial-gradient(70% 90% at 0% 100%,var(--aura-2) 0,rgba(245,239,233,0) 72%),
  var(--gold-soft)}
.l-inst-big::after{display:none}
.l-inst-big h2{font-weight:340;letter-spacing:-.018em}
.l-inst-card{border-radius:var(--r-card)}
.l-inst-ic{border:0;background:var(--gold-soft)}
.l-inst-card h3{font:400 19px/1.25 var(--display)}

/* dúvidas e lista de novidades */
.l-faq{margin:0;max-width:860px}
.l-news{border-top:0}
.l-news::before{width:360px;height:360px;right:-90px;bottom:-210px;border-radius:50%;opacity:.45}
.l-news-row{gap:8px}
.l-news-row input{border:1px solid var(--line-2);border-radius:999px;padding-inline:20px}
.l-news-copy h2{font-weight:340;letter-spacing:-.015em}

/* rodapé */
.l-foot h4{font-weight:600;color:var(--ink)}

/* páginas internas: faixa de título com a mesma luz, caixas de cantos suaves */
.l-banner{border-bottom:0;background:
  radial-gradient(38% 130% at 90% 50%,var(--aura-3) 0,rgba(227,217,206,0) 70%),
  radial-gradient(40% 130% at 66% 120%,var(--aura-2) 0,rgba(245,239,233,0) 72%),
  var(--soft)}
.l-banner::after{display:none}
.l-banner-tit{font-weight:320;letter-spacing:-.02em}
.l-pv-tit{font-weight:340;letter-spacing:-.018em}
.l-qty{border-radius:999px;overflow:hidden}
.l-bloco,.l-resumo,.l-vazio,.l-achamos,.l-suc-box,.l-recado,.l-horarios,.l-rel,.l-hs-box,.l-suggest,.l-wa-balao,.l-tab-wrap,.l-m-edit,.l-volta-foto,.l-volta-cupom,.l-cupom-ativo{border-radius:var(--r-card)}
.l-rcard{border-radius:16px}
.l-modal{border-radius:24px}

/* painel: mesma marca */
.p-brand b{font:italic 300 32px/1 var(--display);letter-spacing:-.01em;text-transform:lowercase}
.p-login-marca b{font:italic 300 44px/1 var(--display);letter-spacing:-.01em;text-transform:lowercase;padding-left:0}
.p-login-marca .arco{width:68px;height:68px;border:0;border-radius:50%;background:var(--halo);box-shadow:0 0 0 1px var(--line-2)}
.p-card,.p-kpi,.p-recibo{border-radius:14px}
.p-login-card{border-radius:22px}
.p-btn,.p-item,.p-demo{border-radius:10px}

.mk{display:block;flex:none;background-color:currentColor;-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat}
.mk-s{--mk:var(--logo-s);aspect-ratio:574/601}
.mk-w{--mk:var(--logo-w);aspect-ratio:401/132}

/* tipo: Poppins é mais larga que a serifa de antes, então os títulos descem um ponto */
.l-hero-tit{font-weight:300;font-size:clamp(32px,4.1vw,56px);line-height:1.15;letter-spacing:-.025em}
.l-h2{font-weight:300;font-size:clamp(25px,2.7vw,36px);line-height:1.18;letter-spacing:-.02em}
.l-h3{font-weight:400;font-size:22px;letter-spacing:-.01em}
.l-banner-tit,.l-pv-tit{font-weight:300;letter-spacing:-.022em}
.l-inst-big h2,.l-news-copy h2{font-weight:300;font-size:clamp(24px,2.6vw,34px);line-height:1.2;letter-spacing:-.02em}
.l-step h3{font:500 18px/1.3 var(--display)}
.l-inst-card h3{font:500 16.5px/1.3 var(--display)}
.l-cat-tile .l-cat-name{font:500 15.5px/1.25 var(--display)}
.l-oc-txt strong{font-weight:500}
.l-hero-eb{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);padding:7px 14px 7px 16px}
.l-lede{max-width:44ch}

/* logo no topo e no rodapé: símbolo + AURA, com a assinatura em Poppins como na logo */
.l-logo{display:flex;align-items:center;gap:14px;color:var(--ink)}
.l-logo .mk-s{width:56px;transition:width .45s var(--ease)}
.l-logo-t{display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.l-logo .mk-w{height:35px;transition:height .45s var(--ease)}
.l-brand .l-brand-sub{display:block;font:500 7px/1 var(--body);letter-spacing:.115em;text-transform:uppercase;color:var(--ink);margin:0;padding:0;white-space:nowrap}
.l-top.rolou .l-logo .mk-s{width:44px}
.l-top.rolou .l-logo .mk-w{height:28px}
.l-top.rolou .l-brand .l-brand-sub{display:none}
@media (max-width:860px){.l-logo{gap:10px}.l-logo .mk-s{width:42px}.l-logo .mk-w{height:26px}.l-brand .l-brand-sub{display:none}.l-top.rolou .l-logo .mk-s{width:38px}.l-top.rolou .l-logo .mk-w{height:24px}}
@media (max-width:420px){.l-logo .mk-s{width:38px}.l-logo .mk-w{height:23px}}
.l-foot-marca .l-logo{gap:16px}
.l-foot-marca .l-logo .mk-s{width:68px}
.l-foot-marca .l-logo .mk-w{height:42px}
.l-foot-marca .l-brand .l-brand-sub{display:block;font-size:8.4px}

/* botões pretos; ao passar o mouse, bege escuro */
.l-btn::before{background:var(--gold-ink)}
.l-btn:hover{border-color:var(--gold-ink)}
.l-aviso{font-weight:400;letter-spacing:.02em}

/* a loja: bloco em bege com o selo da marca em branco */
.l-inst-big{background:var(--gold);color:#17130F}
.l-inst-big .l-eyebrow{color:#000000}
.l-inst-big p{color:#17130F}
.l-inst-big .l-btn-ghost{border-color:#000000;background:transparent}
.l-inst-big::after{display:block;right:34px;top:50%;bottom:auto;width:210px;height:210px;margin-top:-105px;border:0;border-radius:0;opacity:.95;background:#FFFFFF;-webkit-mask:var(--logo-selo) center/contain no-repeat;mask:var(--logo-selo) center/contain no-repeat}
.l-inst-big{padding-right:270px}
@media (max-width:1180px){.l-inst-big{padding-right:36px}.l-inst-big::after{right:-70px;top:auto;bottom:-90px;margin-top:0;width:250px;height:250px;opacity:.55}}
@media (max-width:700px){.l-inst-big{padding-right:22px}.l-inst-big::after{display:none}}
.l-inst-big>*{position:relative;z-index:1}
.l-news::before{border-color:var(--gold)}

/* painel: mesma logo */
.p-brand b{display:flex;align-items:center;gap:10px;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink)}
.p-brand .mk-s{width:38px}
.p-brand .mk-w{height:22px}
.p-login-marca{gap:12px}
.p-login-marca .mk-s{width:78px;color:var(--ink)}

  /* cupons ----------------------------------------------------------------- */
  function cupom(codigo) {

  /* cashback --------------------------------------------------------------- */

  /** saldo disponível da cliente (créditos válidos − usos) — FIFO por validade */
  function cashbackDetalhe(clienteId, quando) {
    quando = d(quando || new Date()).getTime();
    var cred = [], usado = 0;
    S.cashback.forEach(function (m) {
      if (m.clienteId !== clienteId) return;
      if (m.tipo === 'credito') cred.push({ valor: m.valor, validade: m.validade, data: m.data, restante: m.valor });
      else if (m.tipo === 'uso' || m.tipo === 'estorno' || m.tipo === 'expirado') usado += m.valor; // valores positivos que reduzem o saldo
    });

      saldo += c.restante;
      if (c.restante > 0) { if (v <= em15) aVencer += c.restante; if (!proxVenc || c.validade < proxVenc) proxVenc = c.validade; }

  /** Crédito de cortesia (só a dona). */

    var m = { id: uid('cb'), clienteId: clienteId, data: iso(), tipo: 'credito', valor: valor, vendaId: null, origem: 'cortesia', validade: iso(addDias(new Date(), S.cashbackRegras.validadeDias)), obs: obs || 'Cortesia', cortesia: true, usuarioId: usuarioId || null };

  /** Créditos que vencem nos próximos N dias (com saldo restante), por cliente. */
  function cashbackVencendo(dias) {

    S.clientes.forEach(function (c) { var dt = cashbackDetalhe(c.id); if (dt.saldo > 0 && dt.proximoVencimento && d(dt.proximoVencimento).getTime() <= Date.now() + dias * 864e5) out.push({ cliente: c, saldo: dt.saldo, vence: dt.proximoVencimento, aVencer: dt.aVencer15 }); });

  /* ---------------------------------------------------------------------- */

  function proxNumero(chave) { var n = S.contadores[chave]; S.contadores[chave] = n + 1; return n; }
  function mov(o) {

  /**
   * Registra uma venda (PDV da loja ou pedido do site confirmado).
   * o = {
   *   canal: 'loja'|'site', clienteId|null, vendedoraId (usuário),
   *   itens: [{produtoId, varianteId, qtd, preco? (padrão: preço atual)}],
   *   descontoPct? (0-100) | descontoValor?, cashbackUsado? (R$),
   *   pagamentos: [{forma:'pix'|'dinheiro'|'debito'|'credito', valor, parcelas?}],
   *   recebidoDinheiro? (p/ troco), obs?, pedidoId?, data? (ISO, p/ semente)

   */
  function registrarVenda(o, naoSalvar) {
    if (!o.itens || !o.itens.length) return { ok: false, erro: 'Adicione pelo menos uma peça.' };
    var itens = [], subtotal = 0, custoTot = 0, i;
    for (i = 0; i < o.itens.length; i++) {
      var it = o.itens[i], p = produto(it.produtoId), v = p && variante(p, it.varianteId);
      if (!p || !v) return { ok: false, erro: 'Peça não encontrada no estoque.' };
      var q = Math.max(1, parseInt(it.qtd, 10) || 1);

      var preco = it.preco == null ? p.preco : r2(it.preco);
      itens.push({ produtoId: p.id, varianteId: v.id, nome: p.nome, variacao: varianteNome(v), codigo: v.codigo, qtd: q, preco: preco, custo: r2(p.custo || 0) });
      subtotal += preco * q; custoTot += (p.custo || 0) * q;
    }
    subtotal = r2(subtotal);
    var desconto = o.descontoValor != null ? r2(o.descontoValor) : r2(subtotal * (o.descontoPct || 0) / 100);
    desconto = Math.min(desconto, subtotal);
    var cb = r2(Math.max(0, o.cashbackUsado || 0));
    if (cb > 0 && !o.semente) {
      var max = cashbackUsoMax(o.clienteId, subtotal - desconto);
      if (cb > max + 0.009) return { ok: false, erro: 'Cashback acima do permitido (máx. ' + brl(max) + ').' };
    }
    var total = r2(subtotal - desconto - cb);
    var pags = (o.pagamentos || []).filter(function (x) { return x && num(x.valor) > 0; }).map(function (x) { return { forma: x.forma, valor: r2(num(x.valor)), parcelas: x.forma === 'credito' ? (parseInt(x.parcelas, 10) || 1) : null }; });
    var pago = r2(pags.reduce(function (s, x) { return s + x.valor; }, 0));
    if (total > 0 && pago + 0.009 < total) return { ok: false, erro: 'Faltam ' + brl(total - pago) + ' para fechar o pagamento.' };
    var troco = 0;
    if (pago > total) { // excedente só pode ser em dinheiro → vira troco
      troco = r2(pago - total);
      var din = pags.filter(function (x) { return x.forma === 'dinheiro'; })[0];
      if (!din || din.valor < troco) return { ok: false, erro: 'O valor pago passa do total. Só pagamento em dinheiro pode ter troco.' };
      din.valor = r2(din.valor - troco);

    var vd = {

      subtotal: subtotal, desconto: desconto, descontoPct: subtotal ? r2(desconto / subtotal * 100) : 0,
      cashbackUsado: cb, total: total, custo: r2(custoTot), pagamentos: pags, troco: troco,

    itens.forEach(function (it) { mov({ data: quando, tipo: 'venda', produtoId: it.produtoId, varianteId: it.varianteId, qtd: -it.qtd, vendaId: vd.id, usuarioId: vd.vendedoraId, obs: 'Venda nº ' + vd.numero }); });
    pags.forEach(function (pg) { lancarCaixa({ data: quando, tipo: 'entrada', categoria: 'Venda', descricao: 'Venda nº ' + vd.numero + (vd.canal === 'site' ? ' (site)' : ''), valor: pg.valor, forma: pg.forma, vendaId: vd.id, usuarioId: vd.vendedoraId }, true); });
    if (cb > 0) S.cashback.unshift({ id: uid('cb'), clienteId: vd.clienteId, data: quando, tipo: 'uso', valor: cb, vendaId: vd.id, validade: null });
    if (gerado > 0) S.cashback.unshift({ id: uid('cb'), clienteId: vd.clienteId, data: quando, tipo: 'credito', valor: gerado, vendaId: vd.id, origem: 'venda', validade: iso(addDias(o.semente ? quando : new Date(Math.max(d(quando).getTime(), Date.now())), R.validadeDias)) });
    if (vd.clienteId) { var c = cliente(vd.clienteId); if (c) c.ultimaCompra = quando; }

  }
  /** Estorna (cancela) uma venda: devolve estoque, lança saída no caixa e desfaz cashback. */
  function estornarVenda(vendaId, motivo, usuarioId) {

    vd.itens.forEach(function (it) { mov({ tipo: 'estorno', produtoId: it.produtoId, varianteId: it.varianteId, qtd: it.qtd, vendaId: vd.id, usuarioId: usuarioId, obs: 'Estorno da venda nº ' + vd.numero }); });
    vd.pagamentos.forEach(function (pg) { lancarCaixa({ tipo: 'saida', categoria: 'Estorno', descricao: 'Estorno da venda nº ' + vd.numero, valor: pg.valor, forma: pg.forma, vendaId: vd.id, usuarioId: usuarioId }, true); });
    if (vd.cashbackGerado > 0) S.cashback.unshift({ id: uid('cb'), clienteId: vd.clienteId, data: iso(), tipo: 'estorno', valor: vd.cashbackGerado, vendaId: vd.id, validade: null });
    if (vd.cashbackUsado > 0) S.cashback.unshift({ id: uid('cb'), clienteId: vd.clienteId, data: iso(), tipo: 'credito', valor: vd.cashbackUsado, vendaId: vd.id, origem: 'estorno', validade: iso(addDias(new Date(), S.cashbackRegras.validadeDias)) });

  /** Entrada de mercadoria: soma ao estoque e, se informado, atualiza o custo da peça. */

    var p = produto(o.produtoId), v = p && variante(p, o.varianteId), q = parseInt(o.qtd, 10) || 0;
    if (!v || q <= 0) return { ok: false, erro: 'Escolha a peça e uma quantidade maior que zero.' };
    if (o.custoUnit != null && o.custoUnit !== '' && num(o.custoUnit) > 0) p.custo = r2(num(o.custoUnit));
    var m = mov({ tipo: 'entrada', produtoId: p.id, varianteId: v.id, qtd: q, custoUnit: p.custo, obs: o.obs || 'Entrada de mercadoria', usuarioId: o.usuarioId });
    if (o.lancarDespesa) lancarCaixa({ tipo: 'saida', categoria: 'Fornecedor', descricao: 'Compra: ' + q + '× ' + p.nome, valor: q * (p.custo || 0), forma: o.forma || 'pix', usuarioId: o.usuarioId }, true);

  /** Ajuste de inventário: define a quantidade contada. */

    var m = mov({ tipo: 'ajuste', produtoId: o.produtoId, varianteId: o.varianteId, qtd: dif, obs: o.motivo || 'Ajuste de inventário', usuarioId: o.usuarioId });

  /** Saída avulsa (brinde, defeito, uso próprio). */

  /** Cria/atualiza peça. p = objeto completo (ver formato em semente). Retorna {ok, produto}. */
  function salvarProduto(p, usuarioId) {
    if (!p.nome || !String(p.nome).trim()) return { ok: false, erro: 'Dê um nome para a peça.' };
    if (!(num(p.preco) > 0)) return { ok: false, erro: 'Informe o preço.' };
    if (p.precoDe && num(p.precoDe) <= num(p.preco)) return { ok: false, erro: 'O preço "de" precisa ser maior que o preço.' };
    if (!p.categoria) return { ok: false, erro: 'Escolha a categoria.' };
    if (!p.variantes || !p.variantes.length) return { ok: false, erro: 'Cadastre pelo menos uma variação (banho e tamanho).' };

    if (!existente) {
      var base = slug(p.nome), id = base, k = 2; while (produto(id)) id = base + '-' + (k++);
      p.id = id; p.criadoEm = iso();
    }
    p.preco = r2(num(p.preco)); p.precoDe = p.precoDe ? r2(num(p.precoDe)) : null; p.custo = r2(num(p.custo));
    p.variantes.forEach(function (v) {

    });

      p.variantes.forEach(function (v) { var old = byId(existente.variantes, v.id); if (old) v.estoque = old.estoque; else { var ini = parseInt(v.estoque, 10) || 0; v.estoque = 0; if (ini > 0) { existente.variantes.push(v); mov({ tipo: 'entrada', produtoId: existente.id, varianteId: v.id, qtd: ini, custoUnit: p.custo, obs: 'Estoque inicial', usuarioId: usuarioId }); existente.variantes.pop(); } } });
      Object.keys(p).forEach(function (k) { existente[k] = p[k]; });
      salvar('produto'); return { ok: true, produto: existente };
    }

    S.produtos.push(p);
    p.variantes.forEach(function (v, i) { if (inicial[i] > 0) mov({ tipo: 'entrada', produtoId: p.id, varianteId: v.id, qtd: inicial[i], custoUnit: p.custo, obs: 'Estoque inicial', usuarioId: usuarioId }); });

  function excluirProduto(id) {

    S.produtos.splice(i, 1); salvar('produto'); return { ok: true };
  }
  function gerarCodigo() { // EAN-13 interno começando com 789 (dígito verificador correto)

    if (ex) { Object.keys(c).forEach(function (k) { ex[k] = c[k]; }); salvar('cliente'); return { ok: true, cliente: ex }; }
    c.id = uid('cl'); c.criadoEm = iso(); c.origem = c.origem || 'loja'; c.ultimaCompra = null;

      .sort(function (a, b) { return +a.nascimento.slice(8, 10) - +b.nascimento.slice(8, 10); });
  }

  /* fluxo de clientes ----------------------------------------------------- */
  function registrarFluxo(o) { // {vendedoraId, comprou:false, motivo, obs}
    var f = { id: uid('fx'), data: o.data || iso(), vendedoraId: o.vendedoraId || null, comprou: !!o.comprou, motivo: o.comprou ? '' : (o.motivo || 'Outro motivo'), obs: o.obs || '', vendaId: o.vendaId || null };

  /* pedidos do site + carrinhos abandonados -------------------------------- */
  function refPedido() {
