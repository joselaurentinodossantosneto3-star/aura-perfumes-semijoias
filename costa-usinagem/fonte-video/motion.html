<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo-latin.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2212}
@font-face{font-family:'Archivo';src:url(fonts/archivo-ext.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:'Inter';src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:'Inter';src:url(fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:'Inter';src:url(fonts/Inter-Bold.otf);font-weight:700}
@font-face{font-family:'Inter';src:url(fonts/Inter-Black.otf);font-weight:900}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const C = { red: '#c8101e', red2: '#8e0a15', ink: '#0b0b0c', char: '#101113', steel: '#8f939a', paper: '#ecebe7', wa: '#1fae55', dark: '#1c1d21' };

/* ---------------- utilidades ---------------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, d) => cl((t - a) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  expo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inout: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  in: x => x * x * x,
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const ev = (t, a, d, f = E.out) => f(seg(t, a, d));

function font(px, w = 900, fam = 'Archivo', stretch = 'expanded', ls = 0) {
  ctx.font = `${w} ${px}px ${fam}`;
  ctx.fontStretch = fam === 'Archivo' ? stretch : 'normal';
  ctx.letterSpacing = ls + 'px';
}
function fitSize(str, maxW, base, w = 900, fam = 'Archivo', stretch = 'expanded', ls = 0) {
  font(base, w, fam, stretch, ls); const m = ctx.measureText(str).width;
  return m > maxW ? Math.floor(base * maxW / m) : base;
}
function wrapLines(str, maxW) {
  const out = []; let cur = '';
  for (const w of str.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width <= maxW) cur = t; else { if (cur) out.push(cur); cur = w; } }
  if (cur) out.push(cur); return out;
}
/* texto revelado por máscara (sobe de baixo para cima) */
function maskText(str, x, y, size, p, { color = '#fff', align = 'left', stroke = null, lw = 3 } = {}) {
  if (p <= 0) return;
  ctx.save();
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(str).width + 40;
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x - 20;
  ctx.beginPath(); ctx.rect(x0, y - size * 1.02, w, size * 1.3); ctx.clip();
  const yy = y + (1 - p) * size * 1.25;
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(str, x, yy); }
  else { ctx.fillStyle = color; ctx.fillText(str, x, yy); }
  ctx.restore();
}
/* letras uma a uma */
function staggerText(str, cx, y, size, t, t0, step, dur, { color = '#fff' } = {}) {
  const ws = [...str].map(c => ctx.measureText(c).width);
  const ls = parseFloat(ctx.letterSpacing) || 0;
  const total = ws.reduce((a, b) => a + b, 0) + ls * (str.length - 1);
  let x = cx - total / 2;
  const keep = ctx.letterSpacing; ctx.letterSpacing = '0px';
  [...str].forEach((c, i) => { maskText(c, x, y, size, ev(t, t0 + i * step, dur, E.expo), { color }); x += ws[i] + ls; });
  ctx.letterSpacing = keep;
}
function para(x1, x2, slant, y0 = 0, y1 = H) { // paralelogramo vertical inclinado
  ctx.beginPath(); ctx.moveTo(x1 + slant / 2, y0); ctx.lineTo(x2 + slant / 2, y0); ctx.lineTo(x2 - slant / 2, y1); ctx.lineTo(x1 - slant / 2, y1); ctx.closePath();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

/* ---------------- recursos ---------------- */
const IMG = {};
const NOMES = ['logo', 'rotor-molhadeira', 'eclusa-antes', 'eclusa-depois', 'eclusa-40th', 'bomba-vacuo', 'mancal', 'calandragem', 'dosador-bosch', 'engrenagens', 'rotor-alta-rotacao', 'eixos', 'pecas', 'pinhoes',
  'cli-bunge', 'cli-coimbra', 'cli-pronac', 'cli-apoio', 'cli-bequisa', 'cli-nita'];
const WA_PATH = new Path2D('M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.150h-.01a8.230 8.230 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.200 8.200 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.180 8.180 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.22 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.230-1.470-1.380-1.720-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28Z');

async function carregar() {
  await Promise.all(NOMES.map(n => new Promise((ok, err) => { const i = new Image(); i.onload = () => { IMG[n] = i; ok(); }; i.onerror = err; i.src = 'img/' + n + '.jpg'; })));
  const fs = ['900 100px Archivo', '800 100px Archivo', '500 40px Inter', '600 40px Inter', '700 40px Inter', '900 40px Inter'];
  await Promise.all(fs.map(f => document.fonts.load(f, 'AÇÃÉ Ø 1992')));
  await document.fonts.ready;
  // logo com o preto transformado em transparência (para pôr sobre qualquer fundo)
  const l = IMG.logo, c2 = document.createElement('canvas'); c2.width = l.width; c2.height = l.height;
  const x2 = c2.getContext('2d'); x2.drawImage(l, 0, 0); const d = x2.getImageData(0, 0, l.width, l.height);
  for (let i = 0; i < d.data.length; i += 4) { const m = Math.max(d.data[i], d.data[i + 1], d.data[i + 2]); d.data[i + 3] = cl((m - 22) * 5, 0, 255); }
  x2.putImageData(d, 0, 0); IMG.logoA = c2;
  return true;
}

/* ---------------- elementos gráficos ---------------- */
function grid(t, alpha = 1, step = 90, drift = 0) {
  ctx.save(); ctx.lineWidth = 1;
  const off = (drift * t) % step;
  for (let x = -step + off; x < W + step; x += step) { ctx.strokeStyle = `rgba(255,255,255,${0.045 * alpha})`; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -step + off; y < H + step; y += step) { ctx.strokeStyle = `rgba(255,255,255,${0.045 * alpha})`; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function gearPath(cx, cy, R, n, rot, depth = .13) {
  const r = R * (1 - depth), st = Math.PI * 2 / n; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * st;
    const pts = [[r, a], [R, a + st * .18], [R, a + st * .46], [r, a + st * .64]];
    pts.forEach(([rr, aa], k) => { const x = cx + rr * Math.cos(aa), y = cy + rr * Math.sin(aa); (i === 0 && k === 0) ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.arc(cx, cy, r, a + st * .64, a + st, false);
  }
  ctx.closePath();
}
function gear(cx, cy, R, n, rot, p, color, lw = 3) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw;
  const L = 2 * Math.PI * R * 1.7; ctx.setLineDash([L * p, L]);
  gearPath(cx, cy, R, n, rot); ctx.stroke();
  const L2 = 2 * Math.PI * R; ctx.setLineDash([L2 * p, L2]);
  ctx.beginPath(); ctx.arc(cx, cy, R * .58, rot, rot + Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * .2, rot, rot + Math.PI * 2); ctx.stroke();
  for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; ctx.beginPath(); ctx.arc(cx + R * .39 * Math.cos(a), cy + R * .39 * Math.sin(a), R * .08, 0, Math.PI * 2 * p); ctx.stroke(); }
  ctx.restore();
}
function brackets(x, y, w, h, p, len = 46, color = 'rgba(255,255,255,.55)') {
  if (p <= 0) return; const l = len * p; ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3;
  const g = 18;
  [[x - g, y - g, 1, 1], [x + w + g, y - g, -1, 1], [x - g, y + h + g, 1, -1], [x + w + g, y + h + g, -1, -1]].forEach(([a, b, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(a + sx * l, b); ctx.lineTo(a, b); ctx.lineTo(a, b + sy * l); ctx.stroke();
  });
  ctx.restore();
}
function ruler(x, y, w, p, color = 'rgba(255,255,255,.35)') {
  if (p <= 0) return; ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
  const end = x + w * p;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(end, y); ctx.stroke();
  for (let xx = x, i = 0; xx <= end; xx += 20, i++) { const h = i % 5 === 0 ? 16 : 8; ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx, y + h); ctx.stroke(); }
  ctx.restore();
}
function chip(text, x, y, p, bg = C.red, fg = '#fff', size = 30) {
  if (p <= 0) return;
  font(size, 700, 'Inter', 'normal', 5); const w = ctx.measureText(text).width + 34, h = size + 26;
  ctx.save(); ctx.globalAlpha = cl(p * 1.5);
  const ww = w * E.expo(p);
  ctx.beginPath(); ctx.rect(x, y, ww, h); ctx.clip();
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, x + 17, y + h / 2 + 2);
  ctx.restore(); return w;
}
function logoSmall(x, y, h, a = 1) {
  const l = IMG.logoA; const w = l.width * h / l.height; ctx.save(); ctx.globalAlpha = a; ctx.drawImage(l, x, y, w, h); ctx.restore();
}
/* foto com zoom suave; devolve função que converte coordenadas da foto para a tela */
function photo(img, x, y, w, h, z = 1, fx = .5, fy = .5) {
  const ar = w / h; let sw = img.width, sh = img.width / ar; if (sh > img.height) { sh = img.height; sw = sh * ar; }
  sw /= z; sh /= z;
  const sx = cl(img.width * fx - sw / 2, 0, img.width - sw), sy = cl(img.height * fy - sh / 2, 0, img.height - sh);
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  return (px, py) => [x + (px - sx) * w / sw, y + (py - sy) * h / sh, w / sw];
}

/* ---------------- transição em corte diagonal ---------------- */
const SLANT = 700;
function slash(t, b, dir = 1) {
  const d = t - b; if (d < -.3 || d > .3) return;
  const pos = p => lerp(-SLANT / 2 - 40, W + SLANT / 2 + 40, p);
  const band = (lead, trail, col) => {
    let a = pos(E.inout(cl(lead))), z = pos(E.inout(cl(trail)));
    if (dir < 0) { a = W - a; z = W - z; }
    ctx.fillStyle = col; para(Math.min(a, z), Math.max(a, z), SLANT * dir); ctx.fill();
  };
  band((d + .28) / .26, (d - .02) / .26, C.dark);
  band((d + .25) / .25, d / .25, C.red);
}

/* ---------------- CENAS ---------------- */
// 1. Abertura 0 – 4
function sAbertura(t) {
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  // grade que nasce do centro
  ctx.save(); ctx.globalAlpha = ev(t, 0, .8); grid(t, 1, 90, 6); ctx.restore();
  const out = ev(t, 3.45, .5, E.in);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1 + out * .25, 1 + out * .25); ctx.translate(-W / 2, -H / 2);
  // engrenagens
  const gA = lerp(.5, .14, ev(t, 1.2, .5));
  const rot = t * .35;
  gear(540, 930, 400, 26, rot, ev(t, .05, 1.5, E.inout), `rgba(255,255,255,${gA})`, 3);
  const R2 = 210, d = 400 + R2 - 400 * .1, ang = 1.05;
  gear(540 + d * Math.cos(ang), 930 + d * Math.sin(ang), R2, 14, -rot * 26 / 14 + .11, ev(t, .35, 1.4, E.inout), `rgba(255,255,255,${gA * .8})`, 3);
  // marcas de mira
  ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.35 * ev(t, .3, .6)})`; ctx.lineWidth = 2;
  const cr = 60 * ev(t, .3, .6, E.expo);
  ctx.beginPath(); ctx.moveTo(540 - cr, 930); ctx.lineTo(540 + cr, 930); ctx.moveTo(540, 930 - cr); ctx.lineTo(540, 930 + cr); ctx.stroke(); ctx.restore();
  // triângulo vermelho do logo
  const tp = ev(t, 1.15, .55, E.back);
  if (t > 1.15) {
    ctx.save(); ctx.translate(lerp(900, 0, E.expo(seg(t, 1.15, .5))), 0);
    ctx.translate(560, 1180); ctx.rotate((1 - tp) * -.25); ctx.scale(tp, tp); ctx.translate(-560, -1180);
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(70, 1215); ctx.lineTo(1040, 835); ctx.lineTo(820, 1560); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // COSTA
  font(172, 900, 'Archivo', 'expanded', 20);
  staggerText('COSTA', 540, 800, 172, t, 1.45, .07, .55);
  // linha cinza e DESDE 1992
  const lp = ev(t, 1.9, .6, E.expo);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(540 - 420 * lp, 845, 840 * lp, 4);
  font(34, 700, 'Inter', 'normal', 12); ctx.textAlign = 'center';
  maskText('DESDE 1992', 540, 915, 34, ev(t, 2.05, .5, E.expo), { align: 'center', color: '#d7d7db' });
  // USINAGEM no triângulo
  font(104, 900, 'Archivo', 'expanded', 4);
  staggerText('USINAGEM', 600, 1285, 104, t, 1.75, .045, .5);
  ctx.textAlign = 'left';
  // rodapé técnico
  font(26, 600, 'Inter', 'normal', 8); ctx.fillStyle = `rgba(255,255,255,${.5 * ev(t, 2.4, .5)})`; ctx.textAlign = 'center';
  ctx.fillText('MECÂNICA INDUSTRIAL  ·  SÃO VICENTE-SP', 540, 1760); ctx.textAlign = 'left';
  ctx.restore();
}

// 2. Manifesto 4 – 9
function sManifesto(T) {
  const t = T - 4;
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H); grid(T, .7, 90, 10);
  if (t < 1.25) {
    const s1 = fitSize('MECÂNICA', 960, 190);
    font(s1, 900, 'Archivo', 'expanded');
    const p1 = ev(t, 0, .45, E.expo), sc = lerp(1.35, 1, p1);
    ctx.save(); ctx.translate(540, 860); ctx.scale(sc, sc); ctx.globalAlpha = cl(p1 * 2); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('MECÂNICA', 0, 0); ctx.restore();
    const s2 = fitSize('INDUSTRIAL', 960, 190); font(s2, 900, 'Archivo', 'expanded');
    const fill = ev(t, .85, .2);
    ctx.save(); ctx.textAlign = 'center';
    maskText('INDUSTRIAL', 540, 860 + s2 * 1.08, s2, ev(t, .5, .4, E.expo), { align: 'center', stroke: '#fff', lw: 4 });
    if (fill > 0) { ctx.globalAlpha = fill; maskText('INDUSTRIAL', 540, 860 + s2 * 1.08, s2, 1, { align: 'center', color: C.red }); }
    ctx.restore();
  }
  if (t >= 1.0 && t < 3.25) {
    const u = t - 1.0;
    const wp = ev(u, 0, .28, E.inout);
    ctx.fillStyle = C.red; ctx.fillRect(0, H * (1 - wp), W, H * wp);
    if (u > .2) {
      const s1 = fitSize('FABRICAÇÃO', 960, 180); font(s1, 900, 'Archivo', 'expanded'); ctx.textAlign = 'center';
      maskText('FABRICAÇÃO', 540, 820, s1, ev(u, .22, .4, E.expo), { align: 'center', color: '#fff' });
      font(250, 900, 'Inter', 'normal');
      const ap = ev(u, .5, .4, E.back);
      ctx.save(); ctx.translate(540, 1080); ctx.rotate((1 - ap) * .6); ctx.scale(ap, ap); ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.textAlign = 'center'; ctx.strokeText('&', 0, 0); ctx.restore();
      const s3 = fitSize('MANUTENÇÃO', 960, 180); font(s3, 900, 'Archivo', 'expanded');
      maskText('MANUTENÇÃO', 540, 1300, s3, ev(u, 1.0, .4, E.expo), { align: 'center', color: C.ink });
      ctx.textAlign = 'left';
    }
  }
  if (t >= 2.95) {
    const u = t - 2.95;
    const rr = ev(u, 0, .35, E.inout) * 1300;
    ctx.save(); ctx.beginPath(); ctx.arc(540, 900, rr, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H); grid(T, .7, 90, 10);
    // anel contador
    const cp = ev(u, .25, 1.2, E.out);
    ctx.save(); ctx.translate(540, 860);
    for (let k = 0; k < 60; k++) {
      const a = -Math.PI / 2 + k * Math.PI * 2 / 60, on = k / 60 <= cp;
      ctx.strokeStyle = on ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.15)'; ctx.lineWidth = k % 5 === 0 ? 4 : 2;
      const r1 = 360, r2 = k % 5 === 0 ? 330 : 342;
      ctx.beginPath(); ctx.moveTo(r1 * Math.cos(a), r1 * Math.sin(a)); ctx.lineTo(r2 * Math.cos(a), r2 * Math.sin(a)); ctx.stroke();
    }
    ctx.strokeStyle = C.red; ctx.lineWidth = 22; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(0, 0, 300, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * cp); ctx.stroke();
    const n = Math.round(30 * cp);
    font(240, 900, 'Archivo', 'expanded'); ctx.textBaseline = 'middle';
    const w30 = ctx.measureText('30').width; font(140, 900, 'Archivo', 'expanded'); const wp = ctx.measureText('+').width + 8;
    const pe = cp >= 1 ? ev(u, 1.45, .35, E.back) : 0;
    const x0 = -(w30 + wp * pe) / 2;
    ctx.globalAlpha = ev(u, .2, .3); font(240, 900, 'Archivo', 'expanded'); ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.fillText(String(n), x0 + wp * pe + w30 / 2, -10);
    if (pe > 0) { font(140, 900, 'Archivo', 'expanded'); ctx.fillStyle = C.red; ctx.textAlign = 'left'; ctx.globalAlpha = cl(pe);
      ctx.save(); ctx.translate(x0 + wp / 2, -18); ctx.scale(pe, pe); ctx.textAlign = 'center'; ctx.fillText('+', 0, 0); ctx.restore(); }
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
    font(54, 900, 'Archivo', 'expanded', 14); maskText('ANOS', 0, 150, 54, ev(u, .6, .4, E.expo), { align: 'center' });
    ctx.restore();
    font(48, 800, 'Archivo', 'expanded', 3); ctx.textAlign = 'center';
    maskText('DE EXPERIÊNCIA', 540, 1340, 48, ev(u, .75, .4, E.expo), { align: 'center' });
    const lp = ev(u, .9, .5, E.expo); ctx.fillStyle = C.red; ctx.fillRect(540 - 120 * lp, 1390, 240 * lp, 6);
    font(36, 700, 'Inter', 'normal', 8);
    maskText('DESDE 1992  ·  SÃO VICENTE-SP', 540, 1480, 36, ev(u, 1.05, .4, E.expo), { align: 'center', color: '#bdbdc2' });
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// 3. Título "Nossos trabalhos" 9 – 10
function sTitulo(T) {
  const t = T - 9;
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H); grid(T, .8, 90, 30);
  // linhas de velocidade
  ctx.save();
  for (let i = 0; i < 14; i++) {
    const y = 300 + i * 100 + (i % 3) * 13, sp = 1 + (i % 4) * .4;
    const x = lerp(-600, W + 200, cl((t * sp + i * .07) / 1.1));
    ctx.fillStyle = i % 5 === 0 ? C.red : 'rgba(255,255,255,.12)'; ctx.fillRect(x, y, 380 + (i % 3) * 120, i % 5 === 0 ? 6 : 3);
  }
  ctx.restore();
  font(72, 800, 'Archivo', 'expanded', 10); ctx.textAlign = 'center';
  maskText('NOSSOS', 540, 860, 72, ev(t, .05, .4, E.expo), { align: 'center', color: '#bdbdc2' });
  const s = fitSize('TRABALHOS', 980, 190); font(s, 900, 'Archivo', 'expanded');
  maskText('TRABALHOS', 540, 860 + s * 1.05, s, ev(t, .15, .45, E.expo), { align: 'center' });

// 4. Serviços 10 – 35 (2,5 s cada)
const SERV = [

const S0 = 10, SD = 2.5;
function sServico(T) {
  const i = Math.min(SERV.length - 1, Math.floor((T - S0) / SD)), t = T - S0 - i * SD, s = SERV[i];
  ctx.fillStyle = C.char; ctx.fillRect(0, 0, W, H); grid(T, 1, 90, 12);

  ctx.fillText(`${String(i + 1).padStart(2, '0')} / ${SERV.length}`, 1030, 115); ctx.textAlign = 'left';

  font(104, 900, 'Archivo', 'expanded'); const nl = Math.min(2, wrapLines(s.tit, 950).length);

      const p = ev(t, .1 + j * .12, .55, E.expo);

      const dx = d * (1 - p) * 300, dy = d === 0 ? (1 - p) * 300 : 0;

  } else {

  if (rp < 1) { ctx.fillStyle = C.red; ctx.beginPath(); const a = cx + edge; ctx.moveTo(a + sl / 2, top); ctx.lineTo(a + sl / 2 + 130, top); ctx.lineTo(a - sl / 2 + 130, top + ch); ctx.lineTo(a - sl / 2, top + ch); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  brackets(cx, top, cw, ch, ev(t, .45, .4, E.expo));

  // antes e depois
  if (s.ba) {

    // metade "depois" começa sem cor e ganha cor
    ctx.save(); ctx.beginPath(); ctx.rect(mid, top, cx + cw - mid, ch); ctx.clip();
    ctx.globalAlpha = 1 - dp; ctx.filter = 'grayscale(1) brightness(.6)'; photo(im, cx, top, cw, ch, z, .5, .5); ctx.restore();
    ctx.filter = 'none';
    const lh = ch * ev(t, .6, .45, E.expo);
    ctx.fillStyle = '#fff'; ctx.fillRect(mid - 3, top + ch / 2 - lh / 2, 6, lh);

    if (hp > 0) {

    ctx.setLineDash([10, 10]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, r + 18, Math.PI * 2 * cp * .5 + T, Math.PI * 2 * cp + T); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C.red; const dot = ev(t, .7, .3, E.back) * 12; ctx.beginPath(); ctx.arc(px, py, dot, 0, Math.PI * 2); ctx.fill();
    if (s.co.dia) { // cota de diâmetro

  let y = ty + 70 + size;
  lines.forEach((l, j) => { maskText(l, 62, y, size, ev(t, .42 + j * .09, .5, E.expo)); y += size * 1.02; });
  font(46, 500, 'Inter', 'normal');
  const sp = ev(t, .7, .5); ctx.save(); ctx.globalAlpha = sp; ctx.fillStyle = '#cfcfd4'; ctx.fillText(s.sub, 66 + (1 - sp) * -30, y + 18); ctx.restore();

// 5. Mosaico 35 – 38

const TOTAL = 50.5;
const CUTS = [4, 9, 10, ...SERV.slice(1).map((_, i) => S0 + (i + 1) * SD), 35, 38, 46];
function draw(T) {
  ctx.save();
  if (T < 4) sAbertura(T);
  else if (T < 9) sManifesto(T);
  else if (T < 10) sTitulo(T);

}
